<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Lookup System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Number Lookup</h1>
    <p class="sub">Professional Intelligence Panel</p>

    <div class="box">
      <input id="number" placeholder="+8801XXXXXXXXX">
      <button onclick="runLookup()">Search</button>
    </div>

    <div id="status"></div>
    <pre id="output"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
