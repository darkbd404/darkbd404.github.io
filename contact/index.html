<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(120, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 150, 0.08) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 45px 40px;
            width: 100%;
            max-width: 560px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: containerEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            animation: headerEntry 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        @keyframes headerEntry {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header .icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: inline-block;
            animation: iconBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-5px) rotate(5deg); }
        }

        .header h2 {
            background: linear-gradient(135deg, #00d4ff 0%, #b24bf3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b92a8;
            font-size: 14px;
            animation: fadeIn 1s ease 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 22px;
            animation: fieldEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .form-group:nth-child(1) { animation-delay: 0.3s; }
        .form-group:nth-child(2) { animation-delay: 0.4s; }
        .form-group:nth-child(3) { animation-delay: 0.5s; }
        .form-group:nth-child(4) { animation-delay: 0.6s; }
        .form-group:nth-child(5) { animation-delay: 0.7s; }

        @keyframes fieldEntry {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #b8bcd0;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: color 0.3s ease;
        }

        label .req {
            color: #ff4466;
            margin-left: 2px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input::placeholder, textarea::placeholder {
            color: #5a5f7a;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            box-shadow: 
                0 0 0 4px rgba(0, 212, 255, 0.1),
                0 0 20px rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
        }

        input:focus + label,
        textarea:focus + label {
            color: #00d4ff;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.03);
            transform: translateY(-2px);
        }

        .upload-area.has-image {
            border-color: #00ff88;
            padding: 15px;
            background: rgba(0, 255, 136, 0.03);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: none;
            position: relative;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .remove-img {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 68, 102, 0.95);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(255, 68, 102, 0.4);
        }

        .remove-img:hover {
            background: #ff0033;
            transform: scale(1.15) rotate(90deg);
        }

        /* Submit Button */
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff 0%, #b24bf3 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Message */
        .status {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: statusEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes statusEntry {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .status.success {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            display: block;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
        }

        .status.error {
            background: linear-gradient(135deg, rgba(255, 68, 102, 0.1) 0%, rgba(255, 100, 100, 0.1) 100%);
            border: 1px solid rgba(255, 68, 102, 0.3);
            color: #ff4466;
            display: block;
            box-shadow: 0 5px 20px rgba(255, 68, 102, 0.2);
        }

        .status .status-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
            animation: iconPop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes iconPop {
            0% {
                transform: scale(0) rotate(-180deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .status .status-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .status .status-desc {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #5a5f7a;
            font-size: 12px;
            animation: fadeIn 1s ease 1s both;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 25px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .header h2 {
                font-size: 24px;
            }
            .header .icon {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">✉️</div>
        <h2>Contact ADMIN</h2>
        <p>আমাদের সাথে যোগাযোগ করুন</p>
    </div>

    <form id="contactForm" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="req">*</span></label>
                <input type="text" id="name" name="Name" required placeholder="আপনার নাম">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" name="Phone" placeholder="01XXXXXXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Your Email <span class="req">*</span></label>
            <input type="email" id="userEmail" name="Email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label>Subject <span class="req">*</span></label>
            <input type="text" id="subject" name="Subject" required placeholder="বিষয়">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea id="message" name="Message" placeholder="বিস্তারিত লিখুন..."></textarea>
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            <div class="upload-area" id="uploadArea">
                <div id="uploadPlaceholder">
                    <div style="font-size: 45px; margin-bottom: 10px;">🖼️</div>
                    <div style="color: #b8bcd0; font-size: 14px; font-weight: 500;">Click করে image select করুন</div>
                    <div style="color: #5a5f7a; font-size: 12px; margin-top: 5px;">JPG, PNG, GIF (Max 10MB)</div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button type="button" class="remove-img" id="removeImg">✕</button>
                </div>
                <input type="file" name="attachment" accept="image/*" id="imageUpload">
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">
            <span>📤 Send Message</span>
        </button>
    </form>

    <div id="status" class="status"></div>

    <div class="footer">
        Powered by Secure Contact System
    </div>
</div>

<script>
    // ============================================
    // 🔑 CONFIGURATION
    // ============================================
    const CONFIG = {
        ADMIN_EMAIL: "salam04836@gmail.com",
        TELEGRAM_BOT_TOKEN: "7632027646:AAGUSVQjeyPSpBJE2PvzspwCLK1bCPbmLYE",
        TELEGRAM_CHAT_ID: "5916486983",
        CUSTOMER_REPLY_SUBJECT: "✅ আমরা আপনার মেসেজ পেয়েছি!",
        CUSTOMER_REPLY_MESSAGE: `Assalamu Alaikum!

ধন্যবাদ আমাদের সাথে যোগাযোগ করার জন্য।

আমরা আপনার মেসেজ পেয়েছি এবং খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।

আপনার তথ্য:
- Subject: {{subject}}
- Message: {{message}}

আপনার ধৈর্যের জন্য ধন্যবাদ!

Best regards,
Salam
Admin Team`
    };

    // ============================================
    // Browser & IP Info Collection
    // ============================================
    async function collectDeviceInfo() {
        const deviceInfo = {
            userAgent: navigator.userAgent,
            language: navigator.language,
            platform: navigator.platform,
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ip: 'Unknown',
            location: 'Unknown'
        };

        // Get IP address
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            deviceInfo.ip = ipData.ip;

            // Get location from IP
            const locRes = await fetch(`https://ipapi.co/${deviceInfo.ip}/json/`);
            const locData = await locRes.json();
            deviceInfo.location = `${locData.city || 'Unknown'}, ${locData.country_name || 'Unknown'}`;
            deviceInfo.country = locData.country_name || 'Unknown';
            deviceInfo.city = locData.city || 'Unknown';
            deviceInfo.region = locData.region || 'Unknown';
            deviceInfo.org = locData.org || 'Unknown';
        } catch (err) {
            console.log('IP fetch failed');
        }

        return deviceInfo;
    }

    function parseBrowser(userAgent) {
        let browser = 'Unknown';
        let os = 'Unknown';

        if (userAgent.includes('Chrome') && !userAgent.includes('Edg')) browser = 'Chrome';
        else if (userAgent.includes('Firefox')) browser = 'Firefox';
        else if (userAgent.includes('Safari') && !userAgent.includes('Chrome')) browser = 'Safari';
        else if (userAgent.includes('Edg')) browser = 'Edge';
        else if (userAgent.includes('Opera') || userAgent.includes('OPR')) browser = 'Opera';

        if (userAgent.includes('Windows')) os = 'Windows';
        else if (userAgent.includes('Mac')) os = 'macOS';
        else if (userAgent.includes('Linux')) os = 'Linux';
        else if (userAgent.includes('Android')) os = 'Android';
        else if (userAgent.includes('iOS') || userAgent.includes('iPhone') || userAgent.includes('iPad')) os = 'iOS';

        return { browser, os };
    }

    // ============================================
    // Image Upload
    // ============================================
    const imageUpload = document.getElementById('imageUpload');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadArea = document.getElementById('uploadArea');
    const removeImgBtn = document.getElementById('removeImg');
    let selectedFile = null;

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) {
                showStatus('error', '❌', 'File Too Large', 'Image 10MB এর বেশি হতে পারবে না');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.src = ev.target.result;
                uploadPlaceholder.style.display = 'none';
                previewContainer.style.display = 'block';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }
    });

    removeImgBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        selectedFile = null;
        imageUpload.value = '';
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');
    });

    // ============================================
    // Form Submit
    // ============================================
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const userEmail = document.getElementById('userEmail').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span><span class="spinner"></span>Submitting...</span>';
        statusDiv.style.display = 'none';

        // Collect device info
        const deviceInfo = await collectDeviceInfo();
        const { browser, os } = parseBrowser(deviceInfo.userAgent);
        const now = new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' });

        // ====== 1. ADMIN EMAIL (Full data with IP + device info) ======
        try {
            const adminFormData = new FormData();
            adminFormData.append('Name', name);
            adminFormData.append('Email', userEmail);
            adminFormData.append('Phone', phone || 'N/A');
            adminFormData.append('Subject', subject);
            adminFormData.append('Message', message || 'No message');
            adminFormData.append('IP Address', deviceInfo.ip);
            adminFormData.append('Location', deviceInfo.location);
            adminFormData.append('Browser', browser);
            adminFormData.append('Operating System', os);
            adminFormData.append('Device', deviceInfo.platform);
            adminFormData.append('Screen', deviceInfo.screen);
            adminFormData.append('Timezone', deviceInfo.timezone);
            adminFormData.append('Submitted At', now);
            adminFormData.append('_subject', '📩 নতুন Contact: ' + subject);
            adminFormData.append('_captcha', 'false');
            adminFormData.append('_template', 'table');
            
            if (selectedFile) {
                adminFormData.append('attachment', selectedFile);
            }

            await fetch(`https://formsubmit.co/ajax/${CONFIG.ADMIN_EMAIL}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: adminFormData
            });
        } catch (err) {
            console.log('Admin email failed');
        }

        // ====== 2. CUSTOMER EMAIL (Welcome message only) ======
        try {
            const customerFormData = new FormData();
            customerFormData.append('name', name);
            customerFormData.append('_subject', CONFIG.CUSTOMER_REPLY_SUBJECT);
            customerFormData.append('_captcha', 'false');
            customerFormData.append('_template', 'box');
            
            const customMessage = CONFIG.CUSTOMER_REPLY_MESSAGE
                .replace('{{subject}}', subject)
                .replace('{{message}}', message || 'No message');
            
            customerFormData.append('_replyto', CONFIG.ADMIN_EMAIL);
            customerFormData.append('message', customMessage);

            await fetch(`https://formsubmit.co/ajax/${userEmail}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: customerFormData
            });
        } catch (err) {
            console.log('Customer email failed');
        }

        // ====== 3. TELEGRAM BOT (Full data with IP + device info) ======
        try {
            const telegramText = `📩 <b>নতুন Contact Message</b>

👤 <b>Name:</b> ${name}
📧 <b>Email:</b> ${userEmail}
📱 <b>Phone:</b> ${phone || 'N/A'}
📌 <b>Subject:</b> ${subject}
💬 <b>Message:</b>
${message || 'No message'}

━━━━━━━━━━━━━━━━━━
🔍 <b>DEVICE INFO</b>
━━━━━━━━━━━━━━━━━━
🌐 <b>IP Address:</b> <code>${deviceInfo.ip}</code>
📍 <b>Location:</b> ${deviceInfo.location}
🏙️ <b>City:</b> ${deviceInfo.city || 'N/A'}
🗺️ <b>Region:</b> ${deviceInfo.region || 'N/A'}
🌍 <b>Country:</b> ${deviceInfo.country || 'N/A'}
🏢 <b>ISP:</b> ${deviceInfo.org || 'N/A'}

💻 <b>Browser:</b> ${browser}
🖥️ <b>OS:</b> ${os}
📱 <b>Platform:</b> ${deviceInfo.platform}
📐 <b>Screen:</b> ${deviceInfo.screen}
🕐 <b>Timezone:</b> ${deviceInfo.timezone}
📅 <b>Submitted:</b> ${now}`;

            const tgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.TELEGRAM_CHAT_ID,
                    text: telegramText,
                    parse_mode: 'HTML'
                })
            });

            if (tgRes.ok && selectedFile) {
                const imgForm = new FormData();
                imgForm.append('chat_id', CONFIG.TELEGRAM_CHAT_ID);
                imgForm.append('photo', selectedFile);
                imgForm.append('caption', `📎 From: ${name} (${userEmail})\n🌐 IP: ${deviceInfo.ip}`);

                await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: imgForm
                });
            }
        } catch (err) {
            console.log('Telegram failed');
        }

        // ====== RESULT (Simple message for customer) ======
        showStatus(
            'success',
            '✅',
            'Message Sent Successfully!',
            'আপনার মেসেজ সফলভাবে পাঠানো হয়েছে। আমরা শীঘ্রই যোগাযোগ করব।'
        );
        
        form.reset();
        selectedFile = null;
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>📤 Send Message</span>';
    });

    // ============================================
    // Status Message (Customer Friendly)
    // ============================================
    function showStatus(type, icon, title, desc) {
        statusDiv.className = 'status ' + type;
        statusDiv.innerHTML = `
            <span class="status-icon">${icon}</span>
            <div class="status-title">${title}</div>
            <div class="status-desc">${desc}</div>
        `;
        statusDiv.style.display = 'block';
        
        // Scroll to status
        statusDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>

</body>
</html>
