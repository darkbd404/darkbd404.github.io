<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Email Sender V1</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 { text-align: center; margin-bottom: 30px; color: #00d4ff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #b8b8b8; }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }
        textarea { min-height: 150px; resize: vertical; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            display: block;
        }
        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📧 Custom Email Sender</h2>
        <form id="emailForm">
            <div class="form-group">
                <label for="to_email">প্রাপকের ইমেইল *</label>
                <input type="email" id="to_email" name="to_email" required placeholder="receiver@example.com">
            </div>
            <div class="form-group">
                <label for="subject">বিষয় *</label>
                <input type="text" id="subject" name="subject" required placeholder="Email Subject">
            </div>
            <div class="form-group">
                <label for="message">মেসেজ *</label>
                <textarea id="message" name="message" required placeholder="আপনার মেসেজ লিখুন..."></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">📤 ইমেইল পাঠান</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <script type="text/javascript">
        // ============================================
        // 🔑 এখানে আপনার Keys বসান
        // ============================================
        const EMAILJS_CONFIG = {
            PUBLIC_KEY: "PC5UBjTQgBZSViKcN",
            SERVICE_ID: "service_ufum89p",
            TEMPLATE_ID: "template_hytt1pq"
        };

        // Initialize EmailJS
        emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);

        const form = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'পাঠানো হচ্ছে...';
            statusDiv.style.display = 'none';

            const templateParams = {
                to_email: document.getElementById('to_email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                from_name: 'Salam'
            };

            emailjs.send(
                EMAILJS_CONFIG.SERVICE_ID,
                EMAILJS_CONFIG.TEMPLATE_ID,
                templateParams
            )
            .then(function(response) {
                showStatus('success', '✅ ইমেইল সফলভাবে পাঠানো হয়েছে!');
                form.reset();
            }, function(error) {
                showStatus('error', '❌ সমস্যা: ' + (error.text || 'Unknown error'));
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 ইমেইল পাঠান';
            });
        });

        function showStatus(type, message) {
            statusDiv.className = 'status ' + type;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
