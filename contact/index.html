<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Contact Gov-BD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 50px 45px;
            width: 100%;
            max-width: 600px;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            animation: containerEntry 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: headerEntry 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        .header .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            }
            50% {
                transform: scale(1.05) rotate(5deg);
                box-shadow: 0 15px 50px rgba(102, 126, 234, 0.6);
            }
        }

        .header .icon {
            font-size: 50px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.2));
        }

        .header h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 15px;
            font-weight: 400;
        }

        .form-row {
            display: flex;
            gap: 18px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 24px;
            animation: fieldEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .form-group:nth-child(1) { animation-delay: 0.3s; }
        .form-group:nth-child(2) { animation-delay: 0.4s; }
        .form-group:nth-child(3) { animation-delay: 0.5s; }
        .form-group:nth-child(4) { animation-delay: 0.6s; }
        .form-group:nth-child(5) { animation-delay: 0.7s; }

        @keyframes fieldEntry {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: color 0.3s ease;
        }

        label .req {
            color: #e53e3e;
            margin-left: 2px;
        }

        input, textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: #f7fafc;
            color: #2d3748;
            font-size: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input::placeholder, textarea::placeholder {
            color: #a0aec0;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.1),
                0 5px 20px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
            background: #f7fafc;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
        }

        .upload-area.has-image {
            border-color: #48bb78;
            padding: 18px;
            background: rgba(72, 187, 120, 0.05);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: none;
            position: relative;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .remove-img {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(229, 62, 62, 0.95);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.4);
        }

        .remove-img:hover {
            background: #e53e3e;
            transform: scale(1.2) rotate(90deg);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.7s ease, height 0.7s ease;
        }

        .btn:hover::before {
            width: 500px;
            height: 500px;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: statusEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes statusEntry {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .status.success {
            background: linear-gradient(135deg, rgba(72, 187, 120, 0.1) 0%, rgba(56, 178, 172, 0.1) 100%);
            border: 2px solid rgba(72, 187, 120, 0.3);
            color: #2f855a;
            display: block;
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.2);
        }

        .status.error {
            background: linear-gradient(135deg, rgba(229, 62, 62, 0.1) 0%, rgba(237, 100, 166, 0.1) 100%);
            border: 2px solid rgba(229, 62, 62, 0.3);
            color: #c53030;
            display: block;
            box-shadow: 0 8px 25px rgba(229, 62, 62, 0.2);
        }

        .status .status-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            animation: iconPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes iconPop {
            0% {
                transform: scale(0) rotate(-180deg);
            }
            60% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .status .status-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status .status-desc {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #a0aec0;
            font-size: 12px;
            animation: fadeIn 1s ease 1s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 550px) {
            .container {
                padding: 35px 28px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .header h2 {
                font-size: 28px;
            }
            .header .icon-wrapper {
                width: 85px;
                height: 85px;
            }
            .header .icon {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="icon-wrapper">
                <div class="icon">✉️</div>
            </div>
            <h2>Customer Contact</h2>
            <p>We'd love to hear from you. Send us a message!</p>
        </div>

        <form id="contactForm" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span class="req">*</span></label>
                    <input type="text" id="name" name="full_name" required placeholder="Abdus Salam" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" name="phone_number" placeholder="01XXXXXXXXX" autocomplete="tel">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address <span class="req">*</span></label>
                <input type="email" id="userEmail" name="email_address" required placeholder="your.email@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label>Subject <span class="req">*</span></label>
                <input type="text" id="subject" name="email_subject" required placeholder="How can we help you?">
            </div>

            <div class="form-group">
                <label>Your Message</label>
                <textarea id="message" name="full_message" placeholder="Tell us more about your inquiry..."></textarea>
            </div>

            <div class="form-group">
                <label>Attach Image (Optional)</label>
                <div class="upload-area" id="uploadArea">
                    <div id="uploadPlaceholder">
                        <div style="font-size: 50px; margin-bottom: 12px;">📎</div>
                        <div style="color: #4a5568; font-size: 15px; font-weight: 600; margin-bottom: 5px;">Click to upload image</div>
                        <div style="color: #a0aec0; font-size: 13px;">JPG, PNG, GIF (Max 10MB)</div>
                    </div>
                    <div class="preview-container" id="previewContainer">
                        <img id="imagePreview" src="" alt="Preview">
                        <button type="button" class="remove-img" id="removeImg">✕</button>
                    </div>
                    <input type="file" name="attachment" accept="image/*" id="imageUpload">
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span>🚀 Send Message</span>
            </button>
        </form>

        <div id="status" class="status"></div>

        <div class="footer">
            <p>🔒 Your information is secure and encrypted</p>
        </div>
    </div>

<script>
    // Create floating particles

        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            container.appendChild(particle);
        }
    }
    createParticles();

    // ============================================

        CUSTOMER_REPLY_MESSAGE: `<!DOCTYPE html>

    // ============================================
    // Browser & IP Info Collection
    // ============================================
    async function collectDeviceInfo() {
        const deviceInfo = {
            userAgent: navigator.userAgent,
            language: navigator.language,
            platform: navigator.platform,
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ip: 'Unknown',
            location: 'Unknown'
        };

        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            deviceInfo.ip = ipData.ip;

            const locRes = await fetch(`https://ipapi.co/${deviceInfo.ip}/json/`);
            const locData = await locRes.json();
            deviceInfo.location = `${locData.city || 'Unknown'}, ${locData.country_name || 'Unknown'}`;
            deviceInfo.country = locData.country_name || 'Unknown';
            deviceInfo.city = locData.city || 'Unknown';
            deviceInfo.region = locData.region || 'Unknown';
            deviceInfo.org = locData.org || 'Unknown';
        } catch (err) {
            console.log('IP fetch failed');
        }

        return deviceInfo;
    }

    function parseBrowser(userAgent) {
        let browser = 'Unknown';
        let os = 'Unknown';

        if (userAgent.includes('Chrome') && !userAgent.includes('Edg')) browser = 'Chrome';
        else if (userAgent.includes('Firefox')) browser = 'Firefox';
        else if (userAgent.includes('Safari') && !userAgent.includes('Chrome')) browser = 'Safari';
        else if (userAgent.includes('Edg')) browser = 'Edge';
        else if (userAgent.includes('Opera') || userAgent.includes('OPR')) browser = 'Opera';

        if (userAgent.includes('Windows')) os = 'Windows';
        else if (userAgent.includes('Mac')) os = 'macOS';
        else if (userAgent.includes('Linux')) os = 'Linux';
        else if (userAgent.includes('Android')) os = 'Android';
        else if (userAgent.includes('iOS')) os = 'iOS';

        return { browser, os };
    }

    // ============================================
    // Image Upload
    // ============================================
    const imageUpload = document.getElementById('imageUpload');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadArea = document.getElementById('uploadArea');
    const removeImgBtn = document.getElementById('removeImg');
    let selectedFile = null;

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) {
                showStatus('error', '❌', 'File Too Large', 'Image must be less than 10MB');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.src = ev.target.result;
                uploadPlaceholder.style.display = 'none';
                previewContainer.style.display = 'block';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }
    });

    removeImgBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        selectedFile = null;
        imageUpload.value = '';
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');
    });

    // ============================================
    // Form Submit
    // ============================================
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullName = document.getElementById('name').value.trim();
        const userEmail = document.getElementById('userEmail').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span><span class="spinner"></span>Sending...</span>';
        statusDiv.style.display = 'none';

        const deviceInfo = await collectDeviceInfo();
        const { browser, os } = parseBrowser(deviceInfo.userAgent);
        const now = new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' });

        // ====== 1. ADMIN EMAIL ======
        try {
            const adminFormData = new FormData();
            adminFormData.append('Full Name', fullName);
            adminFormData.append('Email', userEmail);
            adminFormData.append('Phone', phone || 'N/A');
            adminFormData.append('Subject', subject);
            adminFormData.append('Message', message || 'No message');
            adminFormData.append('IP Address', deviceInfo.ip);
            adminFormData.append('Location', deviceInfo.location);
            adminFormData.append('Browser', browser);
            adminFormData.append('Operating System', os);
            adminFormData.append('Device', deviceInfo.platform);
            adminFormData.append('Screen', deviceInfo.screen);
            adminFormData.append('Timezone', deviceInfo.timezone);
            adminFormData.append('Submitted At', now);
            adminFormData.append('_subject', '📩 New Contact: ' + subject);
            adminFormData.append('_captcha', 'false');
            adminFormData.append('_content-type', 'text/html');
            
            if (selectedFile) {
                adminFormData.append('attachment', selectedFile);
            }

            await fetch(`https://formsubmit.co/ajax/${CONFIG.ADMIN_EMAIL}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: adminFormData
            });
        } catch (err) {
            console.log('Admin email failed');
        }

        // ====== 2. CUSTOMER EMAIL (Premium HTML) ======
        try {
            const customerFormData = new FormData();
            customerFormData.append('name', fullName);
            customerFormData.append('_subject', CONFIG.CUSTOMER_REPLY_SUBJECT);
            customerFormData.append('_captcha', 'false');
            customerFormData.append('_content-type', 'text/html');
            
            const customMessage = CONFIG.CUSTOMER_REPLY_MESSAGE
                .replace(/{{name}}/g, fullName)
                .replace(/{{subject}}/g, subject)
                .replace(/{{message}}/g, message || 'No message');
            
            customerFormData.append('_replyto', CONFIG.ADMIN_EMAIL);
            customerFormData.append('message', customMessage);

            await fetch(`https://formsubmit.co/ajax/${userEmail}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: customerFormData
            });
        } catch (err) {
            console.log('Customer email failed');
        }

        // ====== 3. TELEGRAM BOT (Premium Format) ======
        try {
            const telegramText = `🎯 <b>NEW CONTACT MESSAGE</b>

👤 <b>CONTACT INFORMATION</b>
├─ Name: <b>${fullName}</b>
├─ Email: <code>${userEmail}</code>
├─ Phone: ${phone || 'N/A'}
└─ Subject: <b>${subject}</b>

💬 <b>MESSAGE</b>
${message || 'No message provided'}

━━━━━━━━━━━━━━━━━━━━━━
📊 <b>DEVICE & LOCATION</b>
━━━━━━━━━━━━━━━━━━━━━━
🌐 <b>IP:</b> <code>${deviceInfo.ip}</code>
📍 <b>Location:</b> ${deviceInfo.location}
🏙️ <b>City:</b> ${deviceInfo.city || 'N/A'}
🌍 <b>Country:</b> ${deviceInfo.country || 'N/A'}
🏢 <b>ISP:</b> ${deviceInfo.org || 'N/A'}

💻 <b>Browser:</b> ${browser}
🖥️ <b>OS:</b> ${os}
📱 <b>Platform:</b> ${deviceInfo.platform}
📐 <b>Screen:</b> ${deviceInfo.screen}
🕐 <b>Timezone:</b> ${deviceInfo.timezone}
📅 <b>Submitted:</b> ${now}`;

            const tgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.TELEGRAM_CHAT_ID,
                    text: telegramText,
                    parse_mode: 'HTML'
                })
            });

            if (tgRes.ok && selectedFile) {
                const imgForm = new FormData();
                imgForm.append('chat_id', CONFIG.TELEGRAM_CHAT_ID);
                imgForm.append('photo', selectedFile);
                imgForm.append('caption', `📎 <b>Image from:</b>\n${fullName}\n📧 ${userEmail}\n🌐 IP: ${deviceInfo.ip}`);

                await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: imgForm
                });
            }
        } catch (err) {
            console.log('Telegram failed');
        }

        // ====== RESULT ======
        showStatus(
            'success',
            '🎉',
            'Message Sent Successfully!',
            'Thank you for contacting us. We will get back to you soon!'
        );
        
        form.reset();
        selectedFile = null;
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀 Send Message</span>';
    });

    // ============================================
    // Status Message
    // ============================================
    function showStatus(type, icon, title, desc) {
        statusDiv.className = 'status ' + type;
        statusDiv.innerHTML = `
            <span class="status-icon">${icon}</span>
            <div class="status-title">${title}</div>
            <div class="status-desc">${desc}</div>
        `;
        statusDiv.style.display = 'block';
        statusDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>

</body>
</html>
