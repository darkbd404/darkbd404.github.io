<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 50px; margin-bottom: 10px; }
        .header h2 { color: #00d4ff; font-size: 26px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }
        label .req { color: #ff4466; }
        input, textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: #555; }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        textarea { min-height: 120px; resize: vertical; }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .upload-area:hover { border-color: #00d4ff; }
        .upload-area.has-image { border-color: #00ff88; padding: 10px; }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .preview-container { display: none; position: relative; }
        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }
        .remove-img {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(255, 68, 68, 0.9);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #0077cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .status.success {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: #00ff88;
            display: block;
        }
        .status.error {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.25);
            color: #ff4466;
            display: block;
        }
        @media (max-width: 500px) {
            .container { padding: 25px 20px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">✉️</div>
        <h2>Contact Us</h2>
    </div>

    <!-- ⭐ এখানে আপনার Gmail দিন -->
    <form id="contactForm" action="https://formsubmit.co/salam04836@gmail.com" method="POST" enctype="multipart/form-data">
        
        <!-- FormSubmit Settings (Hidden Fields) -->
        <input type="hidden" name="_subject" value="নতুন Contact Message!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://formsubmit.co/success">
        
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="req">*</span></label>
                <input type="text" name="Name" required placeholder="আপনার নাম">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="Phone" placeholder="01XXXXXXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Your Email <span class="req">*</span></label>
            <input type="email" name="Email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label>Subject <span class="req">*</span></label>
            <input type="text" name="Subject" required placeholder="বিষয়">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea name="Message" placeholder="বিস্তারিত লিখুন..."></textarea>
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            <div class="upload-area" id="uploadArea">
                <div id="uploadPlaceholder">
                    <div style="font-size: 40px;">🖼️</div>
                    <div style="color: #888; font-size: 14px; margin-top: 8px;">Click করে image select করুন</div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button type="button" class="remove-img" id="removeImg">✕</button>
                </div>
                <input type="file" name="attachment" accept="image/*" id="imageUpload">
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">📤 Send Message</button>
    </form>

    <div id="status" class="status"></div>
</div>

<script>
    // Image Upload Preview
    const imageUpload = document.getElementById('imageUpload');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadArea = document.getElementById('uploadArea');
    const removeImgBtn = document.getElementById('removeImg');

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) {
                alert('Image 10MB এর বেশি হতে পারবে না!');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.src = ev.target.result;
                uploadPlaceholder.style.display = 'none';
                previewContainer.style.display = 'block';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }
    });

    removeImgBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        imageUpload.value = '';
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');
    });

    // Form Submit with AJAX (page reload হবে না)
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
        statusDiv.style.display = 'none';

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
                statusDiv.style.display = 'block';
                form.reset();
                uploadPlaceholder.style.display = 'block';
                previewContainer.style.display = 'none';
                uploadArea.classList.remove('has-image');
            } else {
                throw new Error('Failed');
            }
        } catch (err) {
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ সমস্যা হয়েছে। আবার চেষ্টা করুন।';
            statusDiv.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '📤 Send Message';
        }
    });
</script>

</body>
</html>
