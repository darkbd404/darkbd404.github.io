<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 50px; margin-bottom: 10px; }
        .header h2 { color: #00d4ff; font-size: 26px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; font-weight: 600; }
        label .req { color: #ff4466; }
        input, textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: #555; }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        textarea { min-height: 120px; resize: vertical; }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .upload-area:hover { border-color: #00d4ff; }
        .upload-area.has-image { border-color: #00ff88; padding: 10px; }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .preview-container { display: none; position: relative; }
        .preview-container img { max-width: 100%; max-height: 200px; border-radius: 8px; }
        .remove-img {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(255, 68, 68, 0.9);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #0077cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .status.success {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: #00ff88;
            display: block;
        }
        .status.error {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.25);
            color: #ff4466;
            display: block;
        }
        .log-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        .log-box.show { display: block; }
        .log-item { margin: 3px 0; }
        .log-item.ok { color: #00ff88; }
        .log-item.fail { color: #ff4466; }
        @media (max-width: 500px) {
            .container { padding: 25px 20px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">✉️</div>
        <h2>Contact Us V-1</h2>
    </div>

    <form id="contactForm" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="req">*</span></label>
                <input type="text" id="name" name="Name" required placeholder="আপনার নাম">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" name="Phone" placeholder="01XXXXXXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Your Email <span class="req">*</span></label>
            <input type="email" id="userEmail" name="Email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label>Subject <span class="req">*</span></label>
            <input type="text" id="subject" name="Subject" required placeholder="বিষয়">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea id="message" name="Message" placeholder="বিস্তারিত লিখুন..."></textarea>
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            <div class="upload-area" id="uploadArea">
                <div id="uploadPlaceholder">
                    <div style="font-size: 40px;">🖼️</div>
                    <div style="color: #888; font-size: 14px; margin-top: 8px;">Click করে image select করুন</div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button type="button" class="remove-img" id="removeImg">✕</button>
                </div>
                <input type="file" name="attachment" accept="image/*" id="imageUpload">
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">📤 Send Message</button>
    </form>

    <div id="status" class="status"></div>
    <div id="logBox" class="log-box"></div>
</div>

<script>
    // ============================================
    // 🔑 CONFIGURATION
    // ============================================
    const CONFIG = {
        // Admin Email (আপনার email - যেখানে পুরো message আসবে)
        ADMIN_EMAIL: "salam04836@gmail.com",
        
        // Telegram Bot
        TELEGRAM_BOT_TOKEN: "7632027646:AAGUSVQjeyPSpBJE2PvzspwCLK1bCPbmLYE",
        TELEGRAM_CHAT_ID: "5916486983",
        
        // Customer কে যে confirmation message পাঠানো হবে
        CUSTOMER_REPLY_SUBJECT: "✅ আমরা আপনার মেসেজ পেয়েছি!",
        CUSTOMER_REPLY_MESSAGE: `Assalamu Alaikum!

ধন্যবাদ আমাদের সাথে যোগাযোগ করার জন্য।

আমরা আপনার মেসেজ পেয়েছি এবং খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।

আপনার তথ্য:
- Subject: {{subject}}
- Message: {{message}}

আপনার ধৈর্যের জন্য ধন্যবাদ!

Best regards,
Salam
Admin Team`
    };

    // ============================================
    // Image Upload
    // ============================================
    const imageUpload = document.getElementById('imageUpload');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadArea = document.getElementById('uploadArea');
    const removeImgBtn = document.getElementById('removeImg');
    let selectedFile = null;

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) {
                alert('Image 10MB এর বেশি হতে পারবে না!');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.src = ev.target.result;
                uploadPlaceholder.style.display = 'none';
                previewContainer.style.display = 'block';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }
    });

    removeImgBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        selectedFile = null;
        imageUpload.value = '';
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');
    });

    // ============================================
    // Log Helper
    // ============================================
    const logBox = document.getElementById('logBox');
    function addLog(msg, type = '') {
        logBox.classList.add('show');
        const div = document.createElement('div');
        div.className = 'log-item ' + type;
        div.textContent = '• ' + msg;
        logBox.appendChild(div);
    }

    // ============================================
    // Form Submit
    // ============================================
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const userEmail = document.getElementById('userEmail').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        logBox.innerHTML = '';
        logBox.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
        statusDiv.style.display = 'none';

        let successCount = 0;

        // ====== 1. ADMIN EMAIL এ পুরো message পাঠানো ======
        addLog('Admin email এ পাঠানো হচ্ছে...');
        try {
            const adminFormData = new FormData();
            adminFormData.append('Name', name);
            adminFormData.append('Email', userEmail);
            adminFormData.append('Phone', phone || 'N/A');
            adminFormData.append('Subject', subject);
            adminFormData.append('Message', message || 'No message');
            adminFormData.append('_subject', '📩 নতুন Contact: ' + subject);
            adminFormData.append('_captcha', 'false');
            adminFormData.append('_template', 'table');
            
            if (selectedFile) {
                adminFormData.append('attachment', selectedFile);
            }

            const adminRes = await fetch(`https://formsubmit.co/ajax/${CONFIG.ADMIN_EMAIL}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: adminFormData
            });

            if (adminRes.ok) {
                addLog('✅ Admin email এ পাঠানো হয়েছে', 'ok');
                successCount++;
            } else {
                addLog('❌ Admin email failed', 'fail');
            }
        } catch (err) {
            addLog('❌ Admin email error: ' + err.message, 'fail');
        }

        // ====== 2. CUSTOMER EMAIL এ confirmation message পাঠানো ======
        addLog('Customer email এ confirmation পাঠানো হচ্ছে...');
        try {
            const customerFormData = new FormData();
            customerFormData.append('name', name);
            customerFormData.append('subject', subject);
            customerFormData.append('message', message || 'No message');
            customerFormData.append('_subject', CONFIG.CUSTOMER_REPLY_SUBJECT);
            customerFormData.append('_captcha', 'false');
            customerFormData.append('_template', 'box');
            
            // Custom confirmation message with variables
            const customMessage = CONFIG.CUSTOMER_REPLY_MESSAGE
                .replace('{{subject}}', subject)
                .replace('{{message}}', message || 'No message');
            
            customerFormData.append('_replyto', CONFIG.ADMIN_EMAIL);
            customerFormData.append('message', customMessage);

            const customerRes = await fetch(`https://formsubmit.co/ajax/${userEmail}`, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: customerFormData
            });

            if (customerRes.ok) {
                addLog('✅ Customer email এ confirmation পাঠানো হয়েছে', 'ok');
                successCount++;
            } else {
                addLog('❌ Customer email failed', 'fail');
            }
        } catch (err) {
            addLog('❌ Customer email error: ' + err.message, 'fail');
        }

        // ====== 3. TELEGRAM BOT এ পাঠানো ======
        addLog('Telegram bot এ পাঠানো হচ্ছে...');
        try {
            const now = new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' });
            const telegramText = `📩 <b>নতুন Contact Message</b>

👤 <b>Name:</b> ${name}
📧 <b>Email:</b> ${userEmail}
📱 <b>Phone:</b> ${phone || 'N/A'}
📌 <b>Subject:</b> ${subject}
💬 <b>Message:</b>
${message || 'No message'}

🕐 <b>Time:</b> ${now}`;

            const tgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.TELEGRAM_CHAT_ID,
                    text: telegramText,
                    parse_mode: 'HTML'
                })
            });

            if (tgRes.ok) {
                addLog('✅ Telegram text পাঠানো হয়েছে', 'ok');
                successCount++;

                // Image পাঠানো
                if (selectedFile) {
                    const imgForm = new FormData();
                    imgForm.append('chat_id', CONFIG.TELEGRAM_CHAT_ID);
                    imgForm.append('photo', selectedFile);
                    imgForm.append('caption', `📎 From: ${name} (${userEmail})`);

                    const imgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: imgForm
                    });

                    if (imgRes.ok) {
                        addLog('✅ Telegram image পাঠানো হয়েছে', 'ok');
                    }
                }
            } else {
                addLog('❌ Telegram failed', 'fail');
            }
        } catch (err) {
            addLog('❌ Telegram error: ' + err.message, 'fail');
        }

        // ====== RESULT ======
        if (successCount > 0) {
            statusDiv.className = 'status success';
            statusDiv.textContent = `✅ সফলভাবে পাঠানো হয়েছে! (${successCount}/3)`;
            statusDiv.style.display = 'block';
            form.reset();
            selectedFile = null;
            uploadPlaceholder.style.display = 'block';
            previewContainer.style.display = 'none';
            uploadArea.classList.remove('has-image');
        } else {
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ কিছুই পাঠানো সম্ভব হয়নি।';
            statusDiv.style.display = 'block';
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML = '📤 Send Message';
    });
</script>

</body>
</html>
