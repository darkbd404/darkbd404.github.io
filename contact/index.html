<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 50px; margin-bottom: 10px; }
        .header h2 { color: #00d4ff; font-size: 26px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }
        label .req { color: #ff4466; }
        input, textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: #555; }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        textarea { min-height: 120px; resize: vertical; }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .upload-area:hover { border-color: #00d4ff; }
        .upload-area.has-image { border-color: #00ff88; padding: 10px; }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .preview-container { display: none; position: relative; }
        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }
        .remove-img {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(255, 68, 68, 0.9);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #0077cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .status.success {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: #00ff88;
            display: block;
        }
        .status.error {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.25);
            color: #ff4466;
            display: block;
        }
        .log-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        .log-box.show { display: block; }
        .log-item { margin: 3px 0; }
        .log-item.ok { color: #00ff88; }
        .log-item.fail { color: #ff4466; }
        @media (max-width: 500px) {
            .container { padding: 25px 20px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">✉️</div>
        <h2>Contact Us</h2>
    </div>

    <form id="contactForm">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="req">*</span></label>
                <input type="text" id="name" required placeholder="আপনার নাম">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" placeholder="01XXXXXXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Your Email <span class="req">*</span></label>
            <input type="email" id="userEmail" required placeholder="আপনার email দিন">
        </div>

        <div class="form-group">
            <label>Subject <span class="req">*</span></label>
            <input type="text" id="subject" required placeholder="বিষয়">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea id="message" placeholder="বিস্তারিত লিখুন..."></textarea>
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            <div class="upload-area" id="uploadArea">
                <div id="uploadPlaceholder">
                    <div style="font-size: 40px;">🖼️</div>
                    <div style="color: #888; font-size: 14px; margin-top: 8px;">Click করে image select করুন</div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button type="button" class="remove-img" id="removeImg">✕</button>
                </div>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">📤 Send Message</button>
    </form>

    <div id="status" class="status"></div>
    <div id="logBox" class="log-box"></div>
</div>

<script>
    // ============================================
    // 🔑 CONFIGURATION - এখানে আপনার Keys বসান
    // ============================================
    const CONFIG = {
        // EmailJS Keys
        EMAILJS_PUBLIC_KEY: "PC5UBjTQgBZSViKcN",
        EMAILJS_SERVICE_ID: "service_ufum89p",
        EMAILJS_TEMPLATE_ID: "template_hytt1pq",

        // Admin Email (যেখানে fixed message যাবে)
        ADMIN_EMAIL: "admin@gmail.com",  // ← আপনার email দিন

        // Telegram Bot
        TELEGRAM_BOT_TOKEN: "7632027646:AAGUSVQjeyPSpBJE2PvzspwCLK1bCPbmLYE",
        TELEGRAM_CHAT_ID: "5916486983"
    };

    // Initialize EmailJS
    if (CONFIG.EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
        emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);
    }

    // ============================================
    // Image Upload
    // ============================================
    const imageUpload = document.getElementById('imageUpload');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadArea = document.getElementById('uploadArea');
    const removeImgBtn = document.getElementById('removeImg');
    let selectedFile = null;

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) {
                showStatus('error', '❌ Image 10MB এর বেশি হতে পারবে না!');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.src = ev.target.result;
                uploadPlaceholder.style.display = 'none';
                previewContainer.style.display = 'block';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }
    });

    removeImgBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        selectedFile = null;
        imageUpload.value = '';
        uploadPlaceholder.style.display = 'block';
        previewContainer.style.display = 'none';
        uploadArea.classList.remove('has-image');
    });

    // ============================================
    // Log Helper
    // ============================================
    const logBox = document.getElementById('logBox');
    function addLog(msg, type = '') {
        logBox.classList.add('show');
        const div = document.createElement('div');
        div.className = 'log-item ' + type;
        div.textContent = '• ' + msg;
        logBox.appendChild(div);
    }

    // ============================================
    // Form Submit
    // ============================================
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const userEmail = document.getElementById('userEmail').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        // Reset
        logBox.innerHTML = '';
        logBox.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
        statusDiv.style.display = 'none';

        let successCount = 0;
        let totalTasks = 3; // User email + Admin email + Telegram

        // ====== 1. USER এর EMAIL এ পাঠানো ======
        addLog('User email এ পাঠানো হচ্ছে...');
        try {
            if (CONFIG.EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
                addLog('⚠️ EmailJS keys বসানো হয়নি', 'fail');
            } else {
                await emailjs.send(
                    CONFIG.EMAILJS_SERVICE_ID,
                    CONFIG.EMAILJS_TEMPLATE_ID,
                    {
                        to_email: userEmail,  // ← User এর email
                        from_name: 'Admin',
                        from_email: CONFIG.ADMIN_EMAIL,
                        reply_to: CONFIG.ADMIN_EMAIL,
                        phone: phone || 'N/A',
                        subject: subject,
                        message: message || 'No message'
                    }
                );
                addLog('✅ User email এ পাঠানো হয়েছে', 'ok');
                successCount++;
            }
        } catch (err) {
            addLog('❌ User email failed: ' + (err.text || err.message), 'fail');
            console.error('User email error:', err);
        }

        // ====== 2. ADMIN EMAIL এ পাঠানো ======
        addLog('Admin email এ পাঠানো হচ্ছে...');
        try {
            if (CONFIG.EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
                addLog('⚠️ EmailJS keys বসানো হয়নি', 'fail');
            } else {
                await emailjs.send(
                    CONFIG.EMAILJS_SERVICE_ID,
                    CONFIG.EMAILJS_TEMPLATE_ID,
                    {
                        to_email: CONFIG.ADMIN_EMAIL,  // ← Admin এর fixed email
                        from_name: name,
                        from_email: userEmail,
                        reply_to: userEmail,
                        phone: phone || 'N/A',
                        subject: subject,
                        message: message || 'No message'
                    }
                );
                addLog('✅ Admin email এ পাঠানো হয়েছে', 'ok');
                successCount++;
            }
        } catch (err) {
            addLog('❌ Admin email failed: ' + (err.text || err.message), 'fail');
            console.error('Admin email error:', err);
        }

        // ====== 3. TELEGRAM BOT এ পাঠানো ======
        addLog('Telegram bot এ পাঠানো হচ্ছে...');
        try {
            const now = new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' });
            const telegramText = `📩 <b>নতুন Contact Message</b>

👤 <b>Name:</b> ${name}
📧 <b>Email:</b> ${userEmail}
📱 <b>Phone:</b> ${phone || 'N/A'}
📌 <b>Subject:</b> ${subject}
💬 <b>Message:</b>
${message || 'No message'}

🕐 <b>Time:</b> ${now}`;

            const tgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.TELEGRAM_CHAT_ID,
                    text: telegramText,
                    parse_mode: 'HTML'
                })
            });

            if (tgRes.ok) {
                addLog('✅ Telegram text পাঠানো হয়েছে', 'ok');
                successCount++;

                // Image পাঠানো
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('chat_id', CONFIG.TELEGRAM_CHAT_ID);
                    formData.append('photo', selectedFile);
                    formData.append('caption', `📎 From: ${name} (${userEmail})`);

                    const imgRes = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    if (imgRes.ok) {
                        addLog('✅ Telegram image পাঠানো হয়েছে', 'ok');
                    } else {
                        addLog('⚠️ Telegram image failed', 'fail');
                    }
                }
            } else {
                const errData = await tgRes.json();
                addLog('❌ Telegram failed: ' + (errData.description || 'Unknown'), 'fail');
            }
        } catch (err) {
            addLog('❌ Telegram error: ' + err.message, 'fail');
            console.error('Telegram error:', err);
        }

        // ====== RESULT ======
        if (successCount > 0) {
            showStatus('success', `✅ সফলভাবে পাঠানো হয়েছে! (${successCount}/${totalTasks})`);
            form.reset();
            selectedFile = null;
            uploadPlaceholder.style.display = 'block';
            previewContainer.style.display = 'none';
            uploadArea.classList.remove('has-image');
        } else {
            showStatus('error', '❌ কিছুই পাঠানো সম্ভব হয়নি। নিচের log চেক করুন।');
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML = '📤 Send Message';
    });

    function showStatus(type, msg) {
        statusDiv.className = 'status ' + type;
        statusDiv.textContent = msg;
        statusDiv.style.display = 'block';
    }
</script>

</body>
</html>
