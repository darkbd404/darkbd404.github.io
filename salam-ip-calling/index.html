<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salam IP Calling App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; margin: 0; padding: 0; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #131c21; display: flex; flex-direction: column; position: relative; border-left: 1px solid #232d36; border-right: 1px solid #232d36; }
        
        /* Login Screen styling */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 30px; background: #0b0e14; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; background: #232d36; border: 1px solid #343f4a; color: white; border-radius: 8px; font-size: 16px; }
        .login-btn { width: 100%; padding: 12px; background: #00a884; border: none; color: white; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        /* Main App Interface Header */
        .app-header { background: #1f2c34; padding: 15px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Navigation Tabs like Alaap app */
        .nav-tabs { display: flex; background: #1f2c34; border-bottom: 2px solid #232d36; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; color: #8696a0; font-weight: 600; font-size: 14px; }
        .tab-item.active-tab { color: #00a884; border-bottom: 3px solid #00a884; }
        
        /* Content Panel Layout */
        .content-panel { flex: 1; overflow-y: auto; display: none; padding: 15px; }
        .content-panel.active-panel { display: block; }
        
        /* Dialpad Layout */
        .dial-display { width: 100%; text-align: center; font-size: 34px; padding: 20px 0; letter-spacing: 2px; height: 80px; color: #e9edef; word-break: break-all; }
        .dialpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 280px; margin: 0 auto; }
        .dial-btn { background: #232d36; color: white; border: none; font-size: 26px; width: 70px; height: 70px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: auto; }
        .dial-btn:active { background: #343f4a; }
        .action-container { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 25px; }
        .call-action-btn { background: #00a884; width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; color: white; }
        .backspace-btn { background: transparent; border: none; color: #8696a0; font-size: 24px; cursor: pointer; }

        /* More / Settings Menu Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .menu-card { background: #232d36; padding: 20px; text-align: center; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .balance-text { font-size: 22px; color: #00a884; font-weight: bold; margin-bottom: 10px; }

        /* Active Call Overlay Screen */
        .call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e14; display: none; flex-direction: column; align-items: center; justify-content: space-around; z-index: 999; padding: 40px 20px; }
        .call-avatar { width: 100px; height: 100px; background: #232d36; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .end-call-btn { background: #f44336; width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- AUTHENTICATION SCREEN -->
    <div id="login-screen">
        <h2 style="color: #00a884;">Salam IP-Phone</h2>
        <input type="text" id="username" class="login-input" placeholder="User Number / Account ID">
        <input type="password" id="password" class="login-input" placeholder="Password">
        <button class="login-btn" onclick="handleLogin()">Login / Register</button>
    </div>

    <!-- MAIN APP SCREEN (HIDDEN ON START) -->
    <div id="main-app" style="display: none; flex-direction: column; height: 100%;">
        <div class="app-header">
            <span id="app-title">Dialer</span>
            <span style="font-size: 14px; color: #00a884;" id="my-id-display"></span>
        </div>
        
        <!-- TABS NAV -->
        <div class="nav-tabs">
            <div class="tab-item" id="tab-recent" onclick="switchTab('recent')">Recent</div>
            <div class="tab-item" id="tab-contacts" onclick="switchTab('contacts')">Contacts</div>
            <div class="tab-item active-tab" id="tab-dialpad" onclick="switchTab('dialpad')">Dialpad</div>
            <div class="tab-item" id="tab-more" onclick="switchTab('more')">More</div>
        </div>

        <!-- RECENT CALLS PANEL -->
        <div id="panel-recent" class="content-panel">
            <h4 style="color: #8696a0;">Recent Logs</h4>
            <div style="padding: 10px; background: #232d36; border-radius: 8px; margin-bottom: 8px;">
                <strong>01632331864</strong> <br><span style="font-size:12px;color:#8696a0;">Today, 8:53 AM</span>
            </div>
        </div>

        <!-- CONTACTS PANEL -->
        <div id="panel-contacts" class="content-panel">
            <h4 style="color: #8696a0;">Saved Accounts</h4>
            <div style="padding: 12px; background: #232d36; border-radius: 8px; margin-bottom: 5px; cursor: pointer;" onclick="dialNumber('08640000002')">
                📞 Team Assistant (08640000002)
            </div>
        </div>

        <!-- DIALPAD PANEL (DEFAULT ACTIVE) -->
        <div id="panel-dialpad" class="content-panel active-panel">
            <div class="dial-display" id="dial-output"></div>
            <div class="dialpad-grid">
                <button class="dial-btn" onclick="appendDial('1')">1</button>
                <button class="dial-btn" onclick="appendDial('2')">2</button>
                <button class="dial-btn" onclick="appendDial('3')">3</button>
                <button class="dial-btn" onclick="appendDial('4')">4</button>
                <button class="dial-btn" onclick="appendDial('5')">5</button>
                <button class="dial-btn" onclick="appendDial('6')">6</button>
                <button class="dial-btn" onclick="appendDial('7')">7</button>
                <button class="dial-btn" onclick="appendDial('8')">8</button>
                <button class="dial-btn" onclick="appendDial('9')">9</button>
                <button class="dial-btn" onclick="appendDial('*')">*</button>
                <button class="dial-btn" onclick="appendDial('0')">0</button>
                <button class="dial-btn" onclick="appendDial('#')">#</button>
            </div>
            <div class="action-container">
                <div style="width: 24px;"></div>
                <button class="call-action-btn" onclick="initiateCall()">📞</button>
                <button class="backspace-btn" onclick="popDial()">⌫</button>
            </div>
        </div>

        <!-- MORE / SETTINGS PANEL -->
        <div id="panel-more" class="content-panel">
            <div class="menu-grid">
                <div class="menu-card" style="grid-column: span 2;">
                    <div style="color:#8696a0; font-size:13px;">My Balance</div>
                    <div class="balance-text" id="balance-display">BDT 0.00</div>
                </div>
                <div class="menu-card">My Account</div>
                <div class="menu-card">Settings</div>
                <div class="menu-card">Recharge</div>
                <div class="menu-card">Bill Pay</div>
            </div>
        </div>
    </div>

    <!-- ACTIVE CALL SCREEN OVERLAY -->
    <div id="active-call-screen" class="call-screen">
        <div>
            <h2 id="call-status-label" style="color: #00a884; margin: 0;">Calling...</h2>
            <div style="font-size: 14px; color: #8696a0; text-align: center; margin-top: 5px;" id="call-mode-type"></div>
        </div>
        <div class="call-avatar">👤</div>
        <h1 id="target-call-identity" style="margin: 0; letter-spacing: 1px;">000000</h1>
        <button class="end-call-btn" onclick="terminateCall()">🛑</button>
    </div>

</div>

<script>
    const socket = io();
    let localStream;
    let peerConnection;
    let myAccountID = "";
    let dialedBuffer = "";

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function handleLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        if(!user || !pass) return alert("Please fill up credentials");

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                myAccountID = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                document.getElementById('my-id-display').innerText = "ID: " + myAccountID;
                document.getElementById('balance-display').innerText = "BDT " + data.balance;
                
                // Active on signaling gateway
                socket.emit('register-active-user', myAccountID);
            } else {
                alert(data.message);
            }
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active-tab'));
        document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active-panel'));
        
        document.getElementById('tab-' + tabName).classList.add('active-tab');
        document.getElementById('panel-' + tabName).classList.add('active-panel');
        document.getElementById('app-title').innerText = tabName.toUpperCase();
    }

    function appendDial(val) { dialedBuffer += val; updateDialDisplay(); }
    function popDial() { dialedBuffer = dialedBuffer.slice(0, -1); updateDialDisplay(); }
    function dialNumber(num) { dialedBuffer = num; updateDialDisplay(); switchTab('dialpad'); }
    function updateDialDisplay() { document.getElementById('dial-output').innerText = dialedBuffer; }

    function initiateCall() {
        if(!dialedBuffer) return;
        
        document.getElementById('target-call-identity').innerText = dialedBuffer;
        document.getElementById('active-call-screen').style.display = 'flex';

        // Auto routing condition logic
        if(dialedBuffer.startsWith("0864")) {
            document.getElementById('call-status-label').innerText = "Connecting App Peer...";
            document.getElementById('call-mode-type').innerText = "Internal Free Internet Call";
            
            // WebRTC Call Flow Start
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                peerConnection = new RTCPeerConnection(rtcConfig);
                stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

                peerConnection.createOffer().then(offer => {
                    return peerConnection.setLocalDescription(offer);
                }).then(() => {
                    socket.emit('call-request', { target: dialedBuffer, from: myAccountID, offer: peerConnection.localDescription });
                });
            });
        } else {
            // VoIP Core Routing Standard Mobile
            document.getElementById('call-status-label').innerText = "Dialing Mobile Network...";
            document.getElementById('call-mode-type').innerText = "VoIP SIP Trunk Gateway Outgoing";
            socket.emit('initiate-voip-mobile-call', { mobileNumber: dialedBuffer });
        }
    }

    socket.on('incoming-call', async (data) => {
        let accept = confirm("Incoming app call from " + data.from + ". Answer?");
        if(accept) {
            document.getElementById('target-call-identity').innerText = data.from;
            document.getElementById('active-call-screen').style.display = 'flex';
            document.getElementById('call-status-label').innerText = "Call Connected";

            navigator.mediaDevices.getUserMedia({ audio: true }).then(async (stream) => {
                localStream = stream;
                peerConnection = new RTCPeerConnection(rtcConfig);
                stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('call-accept', { target: data.from, answer: answer });
            });
        }
    });

    socket.on('call-connected', async (data) => {
        document.getElementById('call-status-label').innerText = "Call Active";
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('call-error', (data) => {
        document.getElementById('call-status-label').innerText = "VoIP Routing Switch";
        document.getElementById('call-mode-type').innerText = data.message;
    });

    function terminateCall() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('active-call-screen').style.display = 'none';
        dialedBuffer = "";
        updateDialDisplay();
    }
</script>
</body>
</html>
