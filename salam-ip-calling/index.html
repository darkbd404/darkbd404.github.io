<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Next-Gen Calling Interface</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-3d: #e0e8f5;
            --box-shadow-3d: 9px 9px 16px #be99b3, -9px -9px 16px #ffffff;
            --inner-shadow-3d: inset 3px 3px 7px #b8b0ce, inset -3px -3px 7px #ffffff;
        }
        body {
            background: var(--bg-3d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .phone-container {
            width: 380px;
            height: 720px;
            background: var(--bg-3d);
            border-radius: 30px;
            box-shadow: 12px 12px 24px #b5c1d7, -12px -12px 24px #ffffff;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 4px solid #f1f5fa;
        }
        .screen-panel {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .active-panel { display: flex; }
        .input-3d {
            width: 100%;
            padding: 14px;
            border: none;
            background: var(--bg-3d);
            border-radius: 15px;
            box-shadow: var(--inner-shadow-3d);
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            font-size: 15px;
            color: #4a5568;
        }
        .btn-3d {
            padding: 14px;
            border: none;
            background: var(--bg-3d);
            border-radius: 15px;
            box-shadow: 5px 5px 10px #b5c1d7, -5px -5px 10px #ffffff;
            cursor: pointer;
            font-weight: bold;
            color: #0066cc;
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn-3d:active {
            box-shadow: var(--inner-shadow-3d);
        }
        .dial-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .dial-btn {
            height: 65px;
            font-size: 22px;
            font-weight: 600;
            border: none;
            background: var(--bg-3d);
            border-radius: 50%;
            box-shadow: 5px 5px 10px #b5c1d7, -5px -5px 10px #ffffff;
            color: #2d3748;
            cursor: pointer;
        }
        .dial-btn:active { box-shadow: var(--inner-shadow-3d); }
        .calling-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-3d);
            border-radius: 26px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 20px;
            box-sizing: border-box;
            z-index: 100;
        }
        .video-box {
            width: 100%;
            height: 220px;
            background: #2d3748;
            border-radius: 20px;
            box-shadow: var(--inner-shadow-3d);
            overflow: hidden;
            display: none;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            background: var(--bg-3d);
            padding: 10px;
            border-radius: 20px;
            box-shadow: var(--inner-shadow-3d);
            margin-bottom: 15px;
        }
        .tab-item { cursor: pointer; font-size: 18px; padding: 5px 10px; }
        .active-tab { color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>

<audio id="remoteAudioNode" autoplay></audio>

<div class="phone-container">
    
    <div id="panel-login" class="screen-panel active-panel" style="justify-content: center;">
        <h2 style="text-align: center; color: #0066cc; text-shadow: 2px 2px 4px #b5c1d7;">3D IP Dialer</h2>
        <input type="text" id="login-user" class="input-3d" placeholder="Username / Admin Code">
        <input type="password" id="login-pass" class="input-3d" placeholder="Secure Passphrase">
        <button class="btn-3d" onclick="executeAuthentication()">Login Engine</button>
    </div>

    <div id="panel-admin" class="screen-panel">
        <h3>Admin System Panel</h3>
        <input type="text" id="adm-uid" class="input-3d" placeholder="Account Number ID (Username)">
        <input type="text" id="adm-name" class="input-3d" placeholder="Customer Name">
        <input type="text" id="adm-pass" class="input-3d" placeholder="Set Password">
        <input type="number" id="adm-bal" class="input-3d" placeholder="Initialize Balance">
        <button class="btn-3d" style="margin-bottom: 10px;" onclick="adminCommitUser()">Save User Structure</button>
        <button class="btn-3d" style="color: red;" onclick="location.reload()">Logout</button>
    </div>

    <div id="panel-user-app" class="screen-panel">
        <div class="nav-tabs">
            <div class="tab-item active-tab" id="tab-dialpad" onclick="userRoute('dialpad')">📞</div>
            <div class="tab-item" id="tab-contacts" onclick="userRoute('contacts')">👤</div>
            <div class="tab-item" id="tab-settings" onclick="userRoute('settings')">⚙</div>
        </div>

        <div id="user-dialpad" class="screen-panel active-panel">
            <div id="dial-display-box" class="input-3d" style="height: 55px; font-size: 24px; text-align: center; font-weight: bold; padding-top: 10px;"></div>
            <div class="dial-grid">
                <button class="dial-btn" onclick="dialAppend('1')">1</button>
                <button class="dial-btn" onclick="dialAppend('2')">2</button>
                <button class="dial-btn" onclick="dialAppend('3')">3</button>
                <button class="dial-btn" onclick="dialAppend('4')">4</button>
                <button class="dial-btn" onclick="dialAppend('5')">5</button>
                <button class="dial-btn" onclick="dialAppend('6')">6</button>
                <button class="dial-btn" onclick="dialAppend('7')">7</button>
                <button class="dial-btn" onclick="dialAppend('8')">8</button>
                <button class="dial-btn" onclick="dialAppend('9')">9</button>
                <button class="dial-btn" onclick="dialAppend('*')">*</button>
                <button class="dial-btn" onclick="dialAppend('0')">0</button>
                <button class="dial-btn" onclick="dialAppend('#')">#</button>
            </div>
            <div style="display: flex; justify-content: space-around; margin-top: 20px;">
                <button class="btn-3d" style="border-radius: 50%; width: 60px; height: 60px; font-size: 20px;" onclick="openCallOptions()">📞</button>
                <button class="btn-3d" style="border-radius: 50%; width: 60px; height: 60px; font-size: 20px;" onclick="dialBackspace()">⌫</button>
            </div>
        </div>

        <div id="user-contacts" class="screen-panel">
            <h4>System Contact List</h4>
            <div id="contacts-render-box" style="overflow-y: auto; height: 100%;"></div>
        </div>

        <div id="user-settings" class="screen-panel">
            <div class="input-3d" style="height: auto;">
                <div>📦 <strong>Account Name:</strong> <span id="lbl-cust-name">-</span></div>
                <div style="margin-top: 5px;">🆔 <strong>IP Number:</strong> <span id="lbl-ip-num">-</span></div>
                <div style="margin-top: 5px;">💰 <strong>Balance:</strong> <span id="lbl-live-bal" style="color: green; font-weight: bold;">BDT 0.00</span></div>
            </div>
            <h4>Add Balance Trigger</h4>
            <input type="number" id="refill-input" class="input-3d" placeholder="Enter Refill Amount">
            <button class="btn-3d" onclick="trigger3DRefillRequest()">Add Balance Packet</button>
        </div>
    </div>

    <div id="call-overlay-window" class="calling-overlay">
        <div>
            <h2 id="call-view-target-num" style="margin: 0; text-align: center;">0000</h2>
            <div id="call-view-status" style="text-align: center; color: #0066cc; font-weight: 500; margin-top: 5px;">Connecting...</div>
            <div id="call-live-timer" style="text-align: center; font-size: 20px; font-weight: bold; margin-top: 10px; color: #4a5568; display: none;">00:00</div>
        </div>

        <div id="video-stream-container" class="video-box">
            <video id="remoteVideoTrack" autoplay playsinline></video>
        </div>

        <button class="btn-3d" style="color: red; border-radius: 50%; width: 65px; height: 65px; font-size: 24px;" onclick="terminateActiveSession(true)">❌</button>
    </div>

</div>

<script>
    const socket = io();
    let currentSessionUser = null;
    let currentSessionUid = "";
    let typedCallString = "";
    let webrtcPeerConnection = null;
    let localMicAudioStream = null;
    let currentRemoteActiveTarget = "";
    let callTimerInterval = null;
    let totalSeconds = 0;

    function executeAuthentication() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                document.getElementById('panel-login').classList.remove('active-panel');
                if (data.role === "admin") {
                    document.getElementById('panel-admin').classList.add('active-panel');
                } else {
                    currentSessionUid = username;
                    currentSessionUser = data.user;
                    document.getElementById('panel-user-app').classList.add('active-panel');
                    
                    document.getElementById('lbl-cust-name').innerText = currentSessionUser.name || username;
                    document.getElementById('lbl-ip-num').innerText = username;
                    document.getElementById('lbl-live-bal').innerText = "BDT " + currentSessionUser.balance;

                    socket.emit('register-node', currentSessionUid);
                    loadContactProfiles();
                    userRoute('dialpad');
                }
            } else { alert(data.message); }
        });
    }

    function dialAppend(n) { typedCallString += n; renderDialScreen(); }
    function dialBackspace() { typedCallString = typedCallString.slice(0, -1); renderDialScreen(); }
    function renderDialScreen() { document.getElementById('dial-display-box').innerText = typedCallString; }

    function userRoute(p) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active-tab'));
        document.getElementById('panel-user-app').querySelectorAll('.screen-panel').forEach(panel => panel.classList.remove('active-panel'));
        document.getElementById('tab-' + p).classList.add('active-tab');
        document.getElementById('user-' + p).classList.add('active-panel');
    }

    // ১২৩ আইভিআর (IVR) কাস্টমার কেয়ার ব্যালেন্স সিস্টেম
    function triggerIVRSystem() {
        const bal = currentSessionUser.balance;
        const ivrText = `আপনার বর্তমান ব্যালেন্স হচ্ছে ${bal} টাকা।`;
        const speech = new SpeechSynthesisUtterance(ivrText);
        speech.lang = 'bn-BD';
        speech.rate = 0.9;
        
        document.getElementById('call-view-target-num').innerText = "123";
        document.getElementById('call-view-status').innerText = "Playing IVR Account Stream...";
        document.getElementById('call-overlay-window').style.display = 'flex';

        window.speechSynthesis.speak(speech);
        speech.onend = () => { terminateActiveSession(false); };
    }

    function openCallOptions() {
        if(!typedCallString) return;
        if(typedCallString === "123") { return triggerIVRSystem(); }

        const opt = confirm("Press [OK] for HD Video Call or [Cancel] for Ultra-HD Audio Call.");
        initiateVoiceOutbound(opt ? 'video' : 'audio');
    }

    // লাইভ টাইমার স্টার্ট ফাংশন
    function startCallTimer() {
        totalSeconds = 0;
        const timerBox = document.getElementById('call-live-timer');
        timerBox.style.display = 'block';
        timerBox.innerText = "00:00";
        
        callTimerInterval = setInterval(() => {
            totalSeconds++;
            let min = Math.floor(totalSeconds / 60);
            let sec = totalSeconds % 60;
            timerBox.innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
        }, 1000);
    }

    function initiateVoiceOutbound(type) {
        currentRemoteActiveTarget = typedCallString;
        const constraints = { audio: true, video: type === 'video' ? { width: 1280, height: 720 } : false };

        navigator.mediaDevices.getUserMedia(constraints).then(stream => {
            localMicAudioStream = stream;
            document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
            document.getElementById('call-overlay-window').style.display = 'flex';

            if(type === 'video') document.getElementById('video-stream-container').style.display = 'block';

            webrtcPeerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            stream.getTracks().forEach(track => webrtcPeerConnection.addTrack(track, stream));

            webrtcPeerConnection.ontrack = (e) => {
                if(type === 'video') document.getElementById('remoteVideoTrack').srcObject = e.streams[0];
                else document.getElementById('remoteAudioNode').srcObject = e.streams[0];
            };

            webrtcPeerConnection.createOffer().then(offer => webrtcPeerConnection.setLocalDescription(offer)).then(() => {
                socket.emit('call-node', { target: currentRemoteActiveTarget, from: currentSessionUid, offer: webrtcPeerConnection.localDescription, callType: type });
            });
        });
    }

    socket.on('incoming-call', (data) => {
        currentRemoteActiveTarget = data.from;
        let accept = confirm(`Incoming ${data.callType.toUpperCase()} Call from Node: ${data.from}. Accept?`);
        if(accept) {
            const constraints = { audio: true, video: data.callType === 'video' ? { width: 1280, height: 720 } : false };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                localMicAudioStream = stream;
                document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
                document.getElementById('call-overlay-window').style.display = 'flex';
                
                if(data.callType === 'video') document.getElementById('video-stream-container').style.display = 'block';

                webrtcPeerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                stream.getTracks().forEach(track => webrtcPeerConnection.addTrack(track, stream));

                webrtcPeerConnection.ontrack = (e) => {
                    if(data.callType === 'video') document.getElementById('remoteVideoTrack').srcObject = e.streams[0];
                    else document.getElementById('remoteAudioNode').srcObject = e.streams[0];
                };

                webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.offer)).then(() => {
                    return webrtcPeerConnection.createAnswer();
                }).then(ans => {
                    return webrtcPeerConnection.setLocalDescription(ans);
                }).then(() => {
                    socket.emit('call-accept', { target: currentRemoteActiveTarget, answer: webrtcPeerConnection.localDescription });
                    startCallTimer();
                });
            });
        } else {
            socket.emit('hangup-call', { target: currentRemoteActiveTarget });
        }
    });

    socket.on('call-connected', (data) => {
        document.getElementById('call-view-status').innerText = "Active Session Stream";
        webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        startCallTimer();
    });

    // গিটহাব সিঙ্ক ট্রিকারিং ও টেলিগ্রাম নোটিফিকেশন প্যাকেজ
    function trigger3DRefillRequest() {
        const amt = document.getElementById('refill-input').value;
        if(!amt || amt <= 0) return alert("Enter valid amount");

        fetch('/api/user/request-balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: currentSessionUid,
                name: currentSessionUser.name,
                currentBalance: currentSessionUser.balance,
                amount: amt
            })
        }).then(() => {
            alert("Balance Packet Pinged to Admin Telegram Pipeline.");
            document.getElementById('refill-input').value = "";
        });
    }

    function loadContactProfiles() {
        fetch('/api/users-list').then(res => res.json()).then(users => {
            const box = document.getElementById('contacts-render-box');
            box.innerHTML = "";
            for(let u in users) {
                box.innerHTML += `<div class="input-3d" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="typedCallString='${u}'; renderDialScreen(); userRoute('dialpad');">
                    <div><strong>${users[u].name}</strong><br><small style="color:#718096;">Node: ${u}</small></div>
                    <span style="color:#0066cc;">📞</span>
                </div>`;
            }
        });
    }

    function adminCommitUser() {
        const adminUser = document.getElementById('login-user').value.trim();
        const adminPass = document.getElementById('login-pass').value.trim();
        const targetUser = document.getElementById('adm-uid').value.trim();
        const name = document.getElementById('adm-name').value.trim();
        const password = document.getElementById('adm-pass').value.trim();
        const balance = document.getElementById('adm-bal').value.trim();

        fetch('/api/admin/save-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminUser, adminPass, targetUser, name, password, balance })
        }).then(res => res.json()).then(data => {
            if(data.success) alert("Admin Mutation Applied to Matrix Local JSON Storage.");
        });
    }

    socket.on('call-terminated', () => { terminateActiveSession(false); });
    socket.on('balance-sync', (d) => { document.getElementById('lbl-live-bal').innerText = "BDT " + d.balance; });

    function terminateActiveSession(notify) {
        if(notify && currentRemoteActiveTarget) socket.emit('hangup-call', { target: currentRemoteActiveTarget });
        if(callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        if(webrtcPeerConnection) { webrtcPeerConnection.close(); webrtcPeerConnection = null; }
        if(localMicAudioStream) { localMicAudioStream.getTracks().forEach(t => t.stop()); localMicAudioStream = null; }
        
        window.speechSynthesis.cancel();
        document.getElementById('call-overlay-window').style.display = 'none';
        document.getElementById('video-stream-container').style.display = 'none';
        document.getElementById('call-live-timer').style.display = 'none';
    }
</script>
</body>
</html>
