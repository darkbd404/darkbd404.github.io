<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D IP Calling Engine Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="/socket.io/socket.io.js"></script>
    <!-- আপনার আগের সব CSS এখানেই থাকবে -->
    <style>
        :root {
            --bg-3d: #eef2f7;
            --shadow-out: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --shadow-in: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg-3d);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .app-shell {
            width: 100%; height: 100%;
            background: var(--bg-3d);
            display: flex; flex-direction: column;
            position: relative;
        }
        .screen-panel {
            display: none; flex-direction: column;
            flex: 1; padding: 20px; overflow-y: auto;
        }
        .active-panel { display: flex; }
        .input-3d {
            width: 100%; padding: 16px; border: none;
            background: var(--bg-3d); border-radius: 20px;
            box-shadow: var(--shadow-in); outline: none;
            font-size: 16px; color: #333; margin-bottom: 20px;
        }
        .btn-3d {
            padding: 16px; border: none; background: var(--bg-3d);
            border-radius: 20px; box-shadow: var(--shadow-out);
            cursor: pointer; font-weight: bold; color: #0066cc;
            font-size: 16px; text-align: center; width: 100%;
        }
        .btn-3d:active { box-shadow: var(--shadow-in); }
        .dial-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-top: 15px; justify-items: center;
        }
        .dial-btn {
            width: 70px; height: 70px; font-size: 24px; font-weight: 600;
            border: none; background: var(--bg-3d); border-radius: 50%;
            box-shadow: var(--shadow-out); color: #2d3748; cursor: pointer;
        }
        .dial-btn:active { box-shadow: var(--shadow-in); }
        .nav-tabs {
            display: flex; justify-content: space-around; align-items: center;
            background: var(--bg-3d); padding: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05); border-top: 1px solid #e2e8f0;
        }
        .tab-item { cursor: pointer; font-size: 22px; padding: 10px; border-radius: 15px; transition: 0.2s; }
        .active-tab { box-shadow: var(--shadow-in); color: #0066cc; }
        .calling-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-3d); display: none; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 50px 20px; z-index: 1000;
        }
        .video-container {
            width: 90%; height: 280px; background: #2d3748;
            border-radius: 25px; box-shadow: var(--shadow-in);
            overflow: hidden; display: none; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chat-area {
            flex: 1; box-shadow: var(--shadow-in); border-radius: 20px;
            padding: 15px; overflow-y: auto; margin-bottom: 15px; background: var(--bg-3d);
        }
        .msg-bubble { padding: 10px 14px; border-radius: 15px; margin-bottom: 8px; max-width: 80%; font-size: 15px; }
        .msg-in { background: #fff; align-self: flex-start; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .msg-out { background: #0066cc; color: #fff; align-self: flex-end; margin-left: auto; }
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-weight: bold; font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- আপনার অরিজিনাল HTML Body Content হুবহু এখানে থাকবে -->
    <div id="login-screen">...</div>
    <div id="app-container">...</div>
    
    <!-- ✅ শুধুমাত্র এই স্ক্রিপ্টটি </body> এর আগে যোগ করুন -->
    <script>
        // PWA Notification Permission & Handler
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") showToast("System", "Notifications Enabled!");
                });
            }
        }

        function sendBrowserNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { 
                    body: body, 
                    icon: "https://cdn-icons-png.flaticon.com/512/5585/5585856.png",
                    badge: "https://cdn-icons-png.flaticon.com/512/5585/5585856.png"
                });
            }
        }

        function showToast(title, message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 9999;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white; padding: 15px 20px; border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s ease;
                max-width: 300px; font-family: sans-serif;
            `;
            toast.innerHTML = `<strong>${title}</strong><br>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // Socket Listener for Notifications
        if(typeof socket !== 'undefined') {
            socket.on('system-notification', (data) => {
                sendBrowserNotification(data.title, data.message);
                showToast(data.title, data.message);
            });
        }

        // Call permission on load
        window.addEventListener('load', requestNotificationPermission);
    </script>
</body>
</html>
