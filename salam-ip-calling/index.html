<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Calling Pro Application</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="phone-container">
    
    <!-- AUTH SCREEN -->
    <div id="login-screen">
        <h2 style="color: #0066cc; margin:0 0 10px 0;">IP Call Connect</h2>
        <p style="color: #6c757d; font-size: 14px; margin:0 0 20px 0;">Secure Real-time Communications Engine</p>
        <input type="text" id="username" class="login-input" placeholder="Enter Your Number ID">
        <input type="password" id="password" class="login-input" placeholder="Password">
        <button class="login-btn" onclick="appAuth()">Log In / Create Account</button>
    </div>

    <!-- MAIN DASHBOARD APPLICATION -->
    <div id="main-app" style="display: none; flex-direction: column; height: 100%;">
        <div class="app-header">
            <span class="title" id="header-txt">Dialer</span>
            <span style="font-size: 13px; opacity: 0.9;" id="my-profile-id"></span>
        </div>
        
        <div class="nav-tabs">
            <div class="tab-item active-tab" id="nav-dialpad" onclick="routeTo('dialpad')">📞</div>
            <div class="tab-item" id="nav-recent" onclick="routeTo('recent')">🕒</div>
            <div class="tab-item" id="nav-contacts" onclick="routeTo('contacts')">👤</div>
            <div class="tab-item" id="nav-chat" onclick="routeTo('chat')">💬</div>
            <div class="tab-item" id="nav-settings" onclick="routeTo('settings')">⚙</div>
        </div>

        <!-- TABS PANELS CONTENT -->
        <!-- 1. DIALPAD PANEL -->
        <div id="panel-dialpad" class="content-panel active-panel">
            <div class="dial-header">
                <span>Account Balance</span>
                <strong id="balance-lbl" style="color: #2b8a3e;">BDT 0.00</strong>
            </div>
            <div class="dial-display" id="dial-screen-view"></div>
            <div class="dialpad-grid">
                <button class="dial-btn" onclick="pressKey('1')">1</button>
                <button class="dial-btn" onclick="pressKey('2')">2<span>abc</span></button>
                <button class="dial-btn" onclick="pressKey('3')">3<span>def</span></button>
                <button class="dial-btn" onclick="pressKey('4')">4<span>ghi</span></button>
                <button class="dial-btn" onclick="pressKey('5')">5<span>jkl</span></button>
                <button class="dial-btn" onclick="pressKey('6')">6<span>mno</span></button>
                <button class="dial-btn" onclick="pressKey('7')">7<span>pqrs</span></button>
                <button class="dial-btn" onclick="pressKey('8')">8<span>tuv</span></button>
                <button class="dial-btn" onclick="pressKey('9')">9<span>wxyz</span></button>
                <button class="dial-btn" onclick="pressKey('*')">*</button>
                <button class="dial-btn" onclick="pressKey('0')">0<span>+</span></button>
                <button class="dial-btn" onclick="pressKey('#')">#</button>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; position: relative;">
                <button class="call-trigger-btn" onclick="dialCall()">📞</button>
                <span style="position: absolute; right: 40px; top: 40px; font-size: 22px; cursor: pointer; color: #868e96;" onclick="delDigit()">⌫</span>
            </div>
        </div>

        <!-- 2. RECENT LOGS PANEL -->
        <div id="panel-recent" class="content-panel">
            <div id="logs-container-list"></div>
        </div>

        <!-- 3. CONTACTS ACCESS PANEL -->
        <div id="panel-contacts" class="content-panel">
            <button class="login-btn" onclick="requestContactAccess()" id="permission-btn">Sync Mobile Contacts List</button>
            <div id="native-contacts-box" style="margin-top:15px;"></div>
        </div>

        <!-- 4. CHAT MESSAGING PANEL -->
        <div id="panel-chat" class="content-panel">
            <input type="text" id="chat-target-id" class="login-input" placeholder="Recipient Account Number">
            <div class="chat-box" id="msg-container-box"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="msg-input-field" class="login-input" style="margin:0;" placeholder="Type text packet...">
                <button class="login-btn" style="width:70px; margin:0;" onclick="dispatchMsg()">Send</button>
            </div>
        </div>

        <!-- 5. SETTINGS COMPONENTS -->
        <div id="panel-settings" class="content-panel">
            <div class="settings-group">
                <div class="settings-label">Wallet Balance Engine</div>
                <div class="settings-val" id="settings-balance-lbl">BDT 0.00</div>
                <input type="number" id="recharge-amount-val" class="input-field" placeholder="Enter BDT Amount">
                <button class="login-btn" style="background:#2b8a3e; padding:8px;" onclick="addBalance()">Instant Add Credit</button>
            </div>
            <div class="settings-group">
                <div class="settings-label">Profile Security Check</div>
                <div class="settings-val" style="font-size:14px; color:#495057;">Account Status: <span style="color:#2b8a3e;">Verified Active Node</span></div>
            </div>
        </div>
    </div>

    <!-- CALL SCREEN MODAL -->
    <div id="call-overlay-window" class="calling-overlay">
        <div style="text-align: center;">
            <div style="font-size: 26px; font-weight: bold;" id="call-window-num">0000</div>
            <div style="font-size: 14px; color: #339af0; margin-top: 8px;" id="call-window-status">Connecting Endpoint...</div>
        </div>
        <div style="width:110px; height:110px; background:#212529; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:44px;">👤</div>
        <button class="hangup-btn" onclick="disconnectCall()">❌</button>
    </div>

</div>

<script>
    const socket = io();
    let currentInput = "";
    let activeClientUser = null;
    let peerConnection;
    let localStream;

    function appAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if(!username || !password) return alert("All fields are vital.");

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                activeClientUser = data.user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                document.getElementById('my-profile-id').innerText = "Node: " + username;
                syncBalanceUI(activeClientUser.balance);
                renderLogs(activeClientUser.logs);
                renderMessages(activeClientUser.messages);

                socket.emit('register-active-user', username);
                routeTo('dialpad');
            } else { alert(data.message); }
        });
    }

    function routeTo(panel) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active-panel'));
        document.getElementById('nav-' + panel).classList.add('active-tab');
        document.getElementById('panel-' + panel).classList.add('active-panel');
        document.getElementById('header-txt').innerText = panel.toUpperCase();
    }

    function pressKey(k) { currentInput += k; updateDialUI(); }
    function delDigit() { currentInput = currentInput.slice(0, -1); updateDialUI(); }
    function updateDialUI() { document.getElementById('dial-screen-view').innerText = currentInput; }

    function syncBalanceUI(bal) {
        document.getElementById('balance-lbl').innerText = "BDT " + bal;
        document.getElementById('settings-balance-lbl').innerText = "BDT " + bal;
    }

    function addBalance() {
        const amount = document.getElementById('recharge-amount-val').value;
        if(!amount || amount <= 0) return alert("Invalid entry.");
        fetch('/api/recharge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: document.getElementById('username').value.trim(), amount: amount })
        }).then(res => res.json()).then(data => {
            if(data.success) {
                syncBalanceUI(data.balance);
                document.getElementById('recharge-amount-val').value = "";
                alert("Credit refilled successfully.");
            }
        });
    }

    async function requestContactAccess() {
        // Double security prompt structure requested
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true }); // Mic capture
            if ('contacts' in navigator && 'select' in navigator.contacts) {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                displayContacts(contacts);
            } else {
                // Fallback simulation layout
                const demoList = [{name: "Father (Ahammudul Hoque)", tel:"01712345678"}, {name: "Brother (Minhaj)", tel:"01698765432"}];
                displayContacts(demoList);
            }
            document.getElementById('permission-btn').style.display = 'none';
        } catch(e) {
            alert("Microphone & Contacts Access Permissions Mandatory to execute System Node Pipeline.");
        }
    }

    function displayContacts(arr) {
        const box = document.getElementById('native-contacts-box');
        box.innerHTML = "";
        arr.forEach(c => {
            box.innerHTML += `<div class="list-item" onclick="currentInput='${c.tel.replace(/[^0-9]/g, '')}'; updateDialUI(); routeTo('dialpad');">
                <div class="list-info"><div class="avatar">${c.name[0]}</div><div><div class="item-name">${c.name}</div><div class="item-sub">${c.tel}</div></div></div>
                <span>📞</span>
            </div>`;
        });
    }

    function dialCall() {
        if(!currentInput) return;
        document.getElementById('call-window-num').innerText = currentInput;
        document.getElementById('call-overlay-window').style.display = 'flex';
        
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localStream = stream;
            peerConnection = new RTCPeerConnection();
            stream.getTracks().forEach(t => peerConnection.addTrack(t, stream));

            peerConnection.createOffer().then(o => peerConn.setLocalDescription(o)).then(() => {
                socket.emit('call-request', { target: currentInput, from: document.getElementById('username').value.trim(), offer: peerConnection.localDescription });
            });
        }).catch(() => {
            document.getElementById('call-window-status').innerText = "Hardware Mic Error.";
        });
    }

    socket.on('incoming-call', async (data) => {
        let accept = confirm("Incoming node trace from " + data.from + ". Accept?");
        if(accept) {
            document.getElementById('call-window-num').innerText = data.from;
            document.getElementById('call-overlay-window').style.display = 'flex';
            document.getElementById('call-window-status').innerText = "Active Node Hooked";

            navigator.mediaDevices.getUserMedia({ audio: true }).then(async (stream) => {
                localStream = stream;
                peerConnection = new RTCPeerConnection();
                stream.getTracks().forEach(t => peerConnection.addTrack(t, stream));
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(ans);
                socket.emit('call-accept', { target: data.from, answer: ans });
            });
        }
    });

    socket.on('call-connected', async (data) => {
        document.getElementById('call-window-status').innerText = "Call Active • Billing On";
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('balance-update', (data) => { syncBalanceUI(data.balance); });
    socket.on('force-hangup', () => { disconnectCall(); alert("Deduction Terminated due to low credits."); });
    socket.on('call-error', (data) => { document.getElementById('call-window-status').innerText = data.message; });

    function disconnectCall() {
        if(peerConnection) { peerConnection.close(); peerConnection = null; }
        if(localStream) { localStream.getTracks().forEach(t => t.stop()); }
        document.getElementById('call-overlay-window').style.display = 'none';
    }

    function dispatchMsg() {
        const to = document.getElementById('chat-target-id').value.trim();
        const text = document.getElementById('msg-input-field').value.trim();
        const from = document.getElementById('username').value.trim();
        if(!to || !text) return;

        socket.emit('send-msg', { to, from, text });
        const box = document.getElementById('msg-container-box');
        box.innerHTML += `<div class="msg sent">${text}</div>`;
        document.getElementById('msg-input-field').value = "";
        box.scrollTop = box.scrollHeight;
    }

    socket.on('receive-msg', (data) => {
        const box = document.getElementById('msg-container-box');
        box.innerHTML += `<div class="msg rcv"><strong>${data.from}:</strong> ${data.text}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    function renderLogs(logs) {
        const container = document.getElementById('logs-container-list');
        container.innerHTML = logs.length === 0 ? '<p style="color:#868e96;text-align:center;">No activity logged yet.</p>' : '';
        logs.forEach(l => {
            container.innerHTML += `<div class="list-item"><div><strong>${l.number}</strong><br><small>${l.time}</small></div><span style="color:#fa5252;">-BDT ${l.cost}</span></div>`;
        });
    }

    function renderMessages(msgs) {
        const box = document.getElementById('msg-container-box');
        msgs.forEach(m => { box.innerHTML += `<div class="msg rcv"><strong>${m.from}:</strong> ${m.text}</div>`; });
    }
</script>
</body>
</html>
