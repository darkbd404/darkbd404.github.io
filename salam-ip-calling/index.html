<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Calling Engine Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<audio id="remoteAudioNode" autoplay></audio>

<div class="phone-container">
    
    <div id="panel-login" class="screen-panel active-panel">
        <h2 style="color:#0066cc; margin:0 0 5px 0;">IP Calling Portal</h2>
        <p style="color:#718096; font-size:14px; margin:0 0 25px 0;">Enter account configurations to start node pipeline</p>
        <input type="text" id="login-user" class="input-field" placeholder="User ID / Admin Code">
        <input type="password" id="login-pass" class="input-field" placeholder="Secure Password">
        <button class="btn-primary" onclick="executeAuthentication()">Authenticate & Connect</button>
    </div>

    <div id="panel-admin" class="screen-panel" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #edf2f7; padding-bottom:10px;">
            <h3 style="margin:0; color:#1a202c;">System Control Database</h3>
            <button class="btn-logout" onclick="location.reload()">Admin Logout</button>
        </div>
        <div style="background:#f7fafc; padding:15px; border:1px solid #edf2f7; border-radius:10px; margin-bottom:15px;">
            <h4 style="margin:0 0 10px 0; font-size:14px; color:#4a5568;">User Account Management (CRUD)</h4>
            <input type="text" id="adm-uid" class="input-field" placeholder="Account Number ID">
            <input type="text" id="adm-pass" class="input-field" placeholder="Set Passphrase">
            <input type="number" id="adm-bal" class="input-field" placeholder="Initialize Balance (BDT)">
            <div style="display:flex; gap:10px; margin-top:5px;">
                <button class="btn-primary" style="background:#38a169; flex:1;" onclick="adminCommitUser()">Save / Update</button>
                <button class="btn-primary" style="background:#e53e3e; width:90px;" onclick="adminDeleteUser()">Delete</button>
            </div>
        </div>
        <h4 style="color:#718096; font-size:13px; margin:10px 0 5px 0;">REALTIME USERS LIST</h4>
        <div id="admin-db-list-view"></div>
    </div>

    <div id="panel-user-app" style="display: none; flex-direction: column; height: 100%;">
        <div class="app-header">
            <span id="app-view-title">Dialer</span>
            <button class="btn-logout" onclick="location.reload()">Logout</button>
        </div>
        <div class="nav-tabs">
            <div class="tab-item active-tab" id="tab-dialpad" onclick="userRoute('dialpad')">📞</div>
            <div class="tab-item" id="tab-logs" onclick="userRoute('logs')">🕒</div>
            <div class="tab-item" id="tab-contacts" onclick="userRoute('contacts')">👤</div>
            <div class="tab-item" id="tab-chat" onclick="userRoute('chat')">💬</div>
            <div class="tab-item" id="tab-settings" onclick="userRoute('settings')">⚙</div>
        </div>

        <div id="user-dialpad" class="screen-panel active-panel" style="padding:15px 0;">
            <div style="display:flex; justify-content:space-between; padding:0 22px; color:#718096; font-size:14px;">
                <span>Available Balance</span><strong id="usr-live-balance" style="color:#38a169;">BDT 0.00</strong>
            </div>
            <div class="dial-view" id="dial-display-box"></div>
            <div class="dial-grid">
                <button class="dial-btn" onclick="dialAppend('1')">1</button>
                <button class="dial-btn" onclick="dialAppend('2')">2</button>
                <button class="dial-btn" onclick="dialAppend('3')">3</button>
                <button class="dial-btn" onclick="dialAppend('4')">4</button>
                <button class="dial-btn" onclick="dialAppend('5')">5</button>
                <button class="dial-btn" onclick="dialAppend('6')">6</button>
                <button class="dial-btn" onclick="dialAppend('7')">7</button>
                <button class="dial-btn" onclick="dialAppend('8')">8</button>
                <button class="dial-btn" onclick="dialAppend('9')">9</button>
                <button class="dial-btn" onclick="dialAppend('*')">*</button>
                <button class="dial-btn" onclick="dialAppend('0')">0</button>
                <button class="dial-btn" onclick="dialAppend('#')">#</button>
            </div>
            <div style="display:flex; justify-content:center; align-items:center; position:relative;">
                <button class="call-btn-trigger" onclick="initiateVoiceOutbound()">📞</button>
                <span style="position:absolute; right:55px; font-size:24px; cursor:pointer; color:#a0aec0; top:42px;" onclick="dialBackspace()">⌫</span>
            </div>
        </div>

        <div id="user-logs" class="screen-panel"><div id="logs-list-render"></div></div>

        <div id="user-contacts" class="screen-panel">
            <button class="btn-primary" onclick="syncDeviceContacts()">Grant Native Contacts Stream</button>
            <div id="contacts-list-render" style="margin-top:15px;"></div>
        </div>

        <div id="user-chat" class="screen-panel">
            <input type="text" id="chat-recipient" class="input-field" placeholder="Target Receiver Node ID">
            <div class="chat-window" id="chat-stream-render"></div>
            <div style="display:flex; gap:6px;">
                <input type="text" id="chat-text-payload" class="input-field" style="margin:0;" placeholder="Message packet...">
                <button class="btn-primary" style="width:75px; margin:0;" onclick="dispatchSecureMessage()">Send</button>
            </div>
        </div>

        <div id="user-settings" class="screen-panel">
            <div style="background:#f7fafc; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #edf2f7;">
                <small style="color:#a0aec0; font-weight:bold; letter-spacing:0.5px;">ACCOUNT METADATA</small>
                <div style="margin-top:10px; font-size:16px; color:#1a202c;">Active Node ID: <span id="lbl-profile-uid" style="font-weight:600;">-</span></div>
            </div>
            <div style="background:#f7fafc; padding:15px; border-radius:10px; border:1px solid #edf2f7;">
                <small style="color:#a0aec0; font-weight:bold; letter-spacing:0.5px;">REQUEST BALANCE REFILL</small>
                <input type="number" id="req-bal-val" class="input-field" placeholder="Amount Packet (BDT)">
                <button class="btn-primary" style="background:#38a169;" onclick="triggerRefillRequest()">Transmit Request to Telegram</button>
            </div>
        </div>
    </div>

    <div id="call-overlay-window" class="calling-overlay">
        <div style="text-align: center;">
            <div style="font-size: 30px; font-weight: 600;" id="call-view-target-num">0000</div>
            <div style="font-size: 14px; color: #4299e1; margin-top: 6px; font-weight: 500;" id="call-view-status">Connecting...</div>
        </div>
        <div style="width:115px; height:115px; background:#1a202c; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:50px; border:2px solid #2d3748;">👤</div>
        <button class="hangup-btn" onclick="terminateActiveSession(true)">❌</button>
    </div>
</div>

<script>
    const socket = io();
    let currentSessionUser = null;
    let currentSessionUid = "";
    let typedCallString = "";
    let webrtcPeerConnection = null;
    let localMicAudioStream = null;
    let currentRemoteActiveTarget = "";

    const iceConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function executeAuthentication() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();
        if(!username || !password) return alert("All credentials required.");

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                document.getElementById('panel-login').style.display = 'none';
                
                if (data.role === "admin") {
                    document.getElementById('panel-admin').style.display = 'block';
                    renderAdminDatabaseTable(data.users);
                } else {
                    currentSessionUid = username;
                    currentSessionUser = data.user;
                    document.getElementById('panel-user-app').style.display = 'flex';
                    document.getElementById('lbl-profile-uid').innerText = currentSessionUid;
                    
                    syncUserDatabaseState(currentSessionUser.balance, currentSessionUser.logs, currentSessionUser.messages);
                    socket.emit('register-node', currentSessionUid);
                    userRoute('dialpad');
                }
            } else { alert(data.message); }
        });
    }

    // ADMIN: DATABASE RENDER (Fixed Structure)
    function renderAdminDatabaseTable(users) {
        const box = document.getElementById('admin-db-list-view');
        box.innerHTML = "";
        if (!users || Object.keys(users).length === 0) {
            box.innerHTML = `<p style="color:#718096; text-align:center;">No users registered yet.</p>`;
            return;
        }
        for (let u in users) {
            box.innerHTML += `<div style="padding:12px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:6px; font-size:14px; display:flex; justify-content:space-between; align-items:center;">
                <div><strong>Node ID: ${u}</strong><br><span style="color:#718096;">Pass: ${users[u].password} | Bal: BDT ${users[u].balance}</span></div>
                <button class="btn-logout" style="background:#0066cc; color:#fff; padding:4px 10px; border-radius:5px;" onclick="populateAdminForm('${u}','${users[u].password}','${users[u].balance}')">Modify</button>
            </div>`;
        }
    }

    function populateAdminForm(u, p, b) {
        document.getElementById('adm-uid').value = u;
        document.getElementById('adm-pass').value = p;
        document.getElementById('adm-bal').value = b;
    }

    // ADMIN: SAVE / UPDATE INTERACTION (Fixed API routing payload)
    function adminCommitUser() {
        const adminUser = document.getElementById('login-user').value.trim();
        const adminPass = document.getElementById('login-pass').value.trim();
        const targetUser = document.getElementById('adm-uid').value.trim();
        const password = document.getElementById('adm-pass').value.trim();
        const balance = document.getElementById('adm-bal').value.trim();

        if(!targetUser || !password) return alert("User ID and Password required.");

        fetch('/api/admin/save-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminUser, adminPass, targetUser, password, balance })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                alert("Database update completed successfully!");
                renderAdminDatabaseTable(data.users);
                clearAdminInputs();
            } else {
                alert(data.message || "Failed to save user.");
            }
        }).catch(err => alert("Error communicating with server."));
    }

    function adminDeleteUser() {
        const adminUser = document.getElementById('login-user').value.trim();
        const adminPass = document.getElementById('login-pass').value.trim();
        const targetUser = document.getElementById('adm-uid').value.trim();
        if(!targetUser) return alert("Select a target user to delete.");

        if(confirm("Delete User ID " + targetUser + " permanently?")) {
            fetch('/api/admin/delete-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminUser, adminPass, targetUser })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    alert("User removed.");
                    renderAdminDatabaseTable(data.users);
                    clearAdminInputs();
                } else { alert(data.message); }
            });
        }
    }

    function clearAdminInputs() {
        document.getElementById('adm-uid').value = "";
        document.getElementById('adm-pass').value = "";
        document.getElementById('adm-bal').value = "";
    }

    function userRoute(p) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active-tab'));
        document.getElementById('panel-user-app').querySelectorAll('.screen-panel').forEach(p => p.classList.remove('active-panel'));
        document.getElementById('tab-' + p).classList.add('active-tab');
        document.getElementById('user-' + p).classList.add('active-panel');
        document.getElementById('app-view-title').innerText = p.toUpperCase();
    }

    function dialAppend(n) { typedCallString += n; renderDialScreen(); }
    function dialBackspace() { typedCallString = typedCallString.slice(0, -1); renderDialScreen(); }
    function renderDialScreen() { document.getElementById('dial-display-box').innerText = typedCallString; }

    function setupWebRTCPeer(targetUser) {
        webrtcPeerConnection = new RTCPeerConnection(iceConfiguration);
        
        webrtcPeerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice-candidate', { target: targetUser, candidate: event.candidate });
            }
        };

        webrtcPeerConnection.ontrack = (event) => {
            const remoteAudio = document.getElementById('remoteAudioNode');
            if (remoteAudio) {
                remoteAudio.srcObject = event.streams[0];
            }
        };

        if (localMicAudioStream) {
            localMicAudioStream.getTracks().forEach(track => webrtcPeerConnection.addTrack(track, localMicAudioStream));
        }
    }

    function initiateVoiceOutbound() {
        if(!typedCallString) return;
        currentRemoteActiveTarget = typedCallString;

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localMicAudioStream = stream;
            document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
            document.getElementById('call-overlay-window').style.display = 'flex';
            document.getElementById('call-view-status').innerText = "Calling Node...";

            setupWebRTCPeer(currentRemoteActiveTarget);

            webrtcPeerConnection.createOffer().then(offer => {
                return webrtcPeerConnection.setLocalDescription(offer);
            }).then(() => {
                socket.emit('call-node', { target: currentRemoteActiveTarget, from: currentSessionUid, offer: webrtcPeerConnection.localDescription });
            });
        }).catch(err => {
            alert("Microphone permission required to call.");
        });
    }

    socket.on('incoming-call', (data) => {
        currentRemoteActiveTarget = data.from;
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            let accept = confirm("Incoming Call from Node: " + data.from + ". Answer?");
            if (accept) {
                localMicAudioStream = stream;
                document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
                document.getElementById('call-overlay-window').style.display = 'flex';
                document.getElementById('call-view-status').innerText = "Connecting Audio...";

                setupWebRTCPeer(currentRemoteActiveTarget);

                webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.offer)).then(() => {
                    return webrtcPeerConnection.createAnswer();
                }).then(ans => {
                    return webrtcPeerConnection.setLocalDescription(ans);
                }).then(() => {
                    socket.emit('call-accept', { target: currentRemoteActiveTarget, answer: webrtcPeerConnection.localDescription });
                });
            } else {
                stream.getTracks().forEach(t => t.stop());
                socket.emit('hangup-call', { target: currentRemoteActiveTarget });
            }
        }).catch(() => {
            alert("Microphone error on receiver end.");
        });
    });

    socket.on('call-connected', (data) => {
        document.getElementById('call-view-status').innerText = "Call Active • 10 poysa/min";
        webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', (data) => {
        if (webrtcPeerConnection && data.candidate) {
            webrtcPeerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.error(e));
        }
    });

    socket.on('call-terminated', () => { terminateActiveSession(false); });
    socket.on('force-hangup', () => { terminateActiveSession(false); alert("Insufficient balance!"); });

    socket.on('call-error', (d) => { 
        alert(d.message === "offline" ? "User is offline." : "Insufficient balance!");
        terminateActiveSession(false);
    });

    function terminateActiveSession(notifyServer) {
        if (notifyServer && currentRemoteActiveTarget) {
            socket.emit('hangup-call', { target: currentRemoteActiveTarget });
        }
        if(webrtcPeerConnection) { webrtcPeerConnection.close(); webrtcPeerConnection = null; }
        if(localMicAudioStream) { localMicAudioStream.getTracks().forEach(t => t.stop()); localMicAudioStream = null; }
        document.getElementById('call-overlay-window').style.display = 'none';
        const remoteAudio = document.getElementById('remoteAudioNode');
        if (remoteAudio) remoteAudio.srcObject = null;
    }

    function syncUserDatabaseState(bal, logs, msgs) {
        document.getElementById('usr-live-balance').innerText = "BDT " + bal;
        const logBox = document.getElementById('logs-list-render');
        logBox.innerHTML = logs.length === 0 ? '<p style="text-align:center;font-size:14px;color:#718096;">No call logs.</p>' : '';
        logs.forEach(l => {
            logBox.innerHTML += `<div style="padding:12px; border-bottom:1px solid #edf2f7; font-size:14px;">Dialed: <strong>${l.target}</strong><br><small style="color:#a0aec0;">${l.time}</small><span style="color:#e53e3e; float:right;">-BDT ${l.cost}</span></div>`;
        });
    }
    socket.on('balance-sync', (d) => { document.getElementById('usr-live-balance').innerText = "BDT " + d.balance; });
</script>
</body>
</html>
