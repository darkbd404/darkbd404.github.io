<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D IP Calling Engine Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-3d: #eef2f7;
            --shadow-out: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --shadow-in: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg-3d);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .app-shell {
            width: 100%; height: 100%;
            background: var(--bg-3d);
            display: flex; flex-direction: column;
            position: relative;
        }
        .screen-panel {
            display: none; flex-direction: column;
            flex: 1; padding: 20px; overflow-y: auto;
        }
        .active-panel { display: flex; }
        .input-3d {
            width: 100%; padding: 16px; border: none;
            background: var(--bg-3d); border-radius: 20px;
            box-shadow: var(--shadow-in); outline: none;
            font-size: 16px; color: #333; margin-bottom: 20px;
        }
        .btn-3d {
            padding: 16px; border: none; background: var(--bg-3d);
            border-radius: 20px; box-shadow: var(--shadow-out);
            cursor: pointer; font-weight: bold; color: #0066cc;
            font-size: 16px; text-align: center; width: 100%;
        }
        .btn-3d:active { box-shadow: var(--shadow-in); }
        .dial-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-top: 15px; justify-items: center;
        }
        .dial-btn {
            width: 70px; height: 70px; font-size: 24px; font-weight: 600;
            border: none; background: var(--bg-3d); border-radius: 50%;
            box-shadow: var(--shadow-out); color: #2d3748; cursor: pointer;
        }
        .dial-btn:active { box-shadow: var(--shadow-in); }
        .nav-tabs {
            display: flex; justify-content: space-around; align-items: center;
            background: var(--bg-3d); padding: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05); border-top: 1px solid #e2e8f0;
        }
        .tab-item { cursor: pointer; font-size: 22px; padding: 10px; border-radius: 15px; transition: 0.2s; }
        .active-tab { box-shadow: var(--shadow-in); color: #0066cc; }
        .calling-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-3d); display: none; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 50px 20px; z-index: 1000;
        }
        .video-container {
            width: 90%; height: 280px; background: #2d3748;
            border-radius: 25px; box-shadow: var(--shadow-in);
            overflow: hidden; display: none; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chat-area {
            flex: 1; box-shadow: var(--shadow-in); border-radius: 20px;
            padding: 15px; overflow-y: auto; margin-bottom: 15px; background: var(--bg-3d);
        }
        .msg-bubble { padding: 10px 14px; border-radius: 15px; margin-bottom: 8px; max-width: 80%; font-size: 15px; }
        .msg-in { background: #fff; align-self: flex-start; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .msg-out { background: #0066cc; color: #fff; align-self: flex-end; margin-left: auto; }
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-weight: bold; font-size: 18px;
        }
    </style>
</head>
<body>

<audio id="remoteAudioNode" autoplay></audio>

<div class="app-shell">
    
    <div id="panel-login" class="screen-panel active-panel" style="justify-content: center;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="color: #0066cc; font-size: 28px; margin: 0; text-shadow: 2px 2px 4px #d1d9e6;">3D ENGINE</h2>
            <p style="color: #718096; margin-top: 5px;">Next-Gen Calling Node</p>
        </div>
        <input type="text" id="login-user" class="input-3d" placeholder="Username / Admin Code">
        <input type="password" id="login-pass" class="input-3d" placeholder="Secure Password">
        <button class="btn-3d" onclick="executeAuthentication()">Sign In Pipeline</button>
        <button id="pwa-install-btn" class="btn-3d" style="margin-top: 20px; display: none; color: #38a169;">Install Application</button>
    </div>

    <div id="panel-admin" class="screen-panel">
        <div class="header-bar" style="padding:0 0 15px 0;">
            <span>System Control DB</span>
            <button class="btn-3d" style="width: auto; padding: 8px 15px; font-size: 14px;" onclick="location.reload()">Logout</button>
        </div>
        <input type="text" id="adm-uid" class="input-3d" placeholder="Username (IP Number)">
        <input type="text" id="adm-name" class="input-3d" placeholder="Customer Full Name">
        <input type="text" id="adm-pass" class="input-3d" placeholder="Passphrase Secret">
        <input type="number" id="adm-bal" class="input-3d" placeholder="Credit Balance (BDT)">
        
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <button class="btn-3d" style="color: #38a169;" onclick="adminCommitUser()">Save Config</button>
            <button class="btn-3d" style="color: #e53e3e;" onclick="adminDeleteUser()">Delete Node</button>
        </div>
        
        <h4>Registered Nodes Stream</h4>
        <div id="admin-db-list-view" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <div id="panel-user-app" style="display: none; flex-direction: column; height: 100%;">
        <div class="header-bar">
            <span id="app-view-title">Dialer</span>
            <span id="pwa-status-badge" style="font-size: 12px; color: #38a169; box-shadow: var(--shadow-in); padding: 4px 10px; border-radius: 10px;">Online</span>
        </div>

        <div id="user-dialpad" class="screen-panel active-panel">
            <input type="text" id="dial-display-box" class="input-3d" style="text-align: center; font-size: 26px; font-weight: bold; height: 65px;" readonly>
            
            <div class="dial-grid">
                <button class="dial-btn" onclick="dialAppend('1')">1</button>
                <button class="dial-btn" onclick="dialAppend('2')">2</button>
                <button class="dial-btn" onclick="dialAppend('3')">3</button>
                <button class="dial-btn" onclick="dialAppend('4')">4</button>
                <button class="dial-btn" onclick="dialAppend('5')">5</button>
                <button class="dial-btn" onclick="dialAppend('6')">6</button>
                <button class="dial-btn" onclick="dialAppend('7')">7</button>
                <button class="dial-btn" onclick="dialAppend('8')">8</button>
                <button class="dial-btn" onclick="dialAppend('9')">9</button>
                <button class="dial-btn" onclick="dialAppend('*')">*</button>
                <button class="dial-btn" onclick="dialAppend('0')">0</button>
                <button class="dial-btn" onclick="dialAppend('#')">#</button>
            </div>
            
            <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 25px;">
                <button class="dial-btn" style="color: #38a169;" onclick="openCallOptions('audio')">📞</button>
                <button class="dial-btn" style="color: #0066cc;" onclick="openCallOptions('video')">📹</button>
                <button class="dial-btn" style="color: #e53e3e; font-size: 18px;" onclick="dialBackspace()">⌫</button>
            </div>
        </div>

        <div id="user-logs" class="screen-panel">
            <div id="logs-list-render" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <div id="user-contacts" class="screen-panel">
            <div id="contacts-render-box" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <div id="user-chat" class="screen-panel">
            <input type="text" id="chat-recipient" class="input-3d" placeholder="Recipient IP Number">
            <div class="chat-area" id="chat-stream-render"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-text-payload" class="input-3d" style="margin:0;" placeholder="Type secure packet...">
                <button class="btn-3d" style="width: 80px;" onclick="dispatchSecureMessage()">Send</button>
            </div>
        </div>

        <div id="user-settings" class="screen-panel">
            <div class="input-3d" style="height: auto; line-height: 1.8;">
                <div>👤 <strong>Account Name:</strong> <span id="lbl-cust-name">-</span></div>
                <div>🆔 <strong>IP Number:</strong> <span id="lbl-ip-num">-</span></div>
                <div>💰 <strong>Balance:</strong> <span id="lbl-live-bal" style="color: #38a169; font-weight: bold;">BDT 0.00</span></div>
            </div>
            <h4 style="margin-top: 10px;">Request Gateway Refill</h4>
            <input type="number" id="refill-input" class="input-3d" placeholder="Amount (BDT)">
            <button class="btn-3d" style="color: #38a169;" onclick="trigger3DRefillRequest()">Transmit Packet</button>
            <button class="btn-3d" style="color: #e53e3e; margin-top: 15px;" onclick="location.reload()">Disconnect Engine</button>
        </div>

        <div class="nav-tabs">
            <div class="tab-item active-tab" id="tab-dialpad" onclick="userRoute('dialpad')">📞</div>
            <div class="tab-item" id="tab-logs" onclick="userRoute('logs')">🕒</div>
            <div class="tab-item" id="tab-contacts" onclick="userRoute('contacts')">👤</div>
            <div class="tab-item" id="tab-chat" onclick="userRoute('chat')">💬</div>
            <div class="tab-item" id="tab-settings" onclick="userRoute('settings')">⚙</div>
        </div>
    </div>

    <div id="call-overlay-window" class="calling-overlay">
        <div style="text-align: center;">
            <h2 id="call-view-target-num" style="margin: 0; font-size: 32px;">0000</h2>
            <div id="call-view-status" style="color: #0066cc; margin-top: 8px; font-weight: bold;">Stream Connecting...</div>
            <div id="call-live-timer" style="font-size: 22px; font-weight: bold; margin-top: 10px; color: #4a5568; display: none;">00:00</div>
        </div>

        <div id="video-stream-container" class="video-container">
            <video id="remoteVideoTrack" autoplay playsinline></video>
        </div>

        <button class="btn-3d" style="color: red; border-radius: 50%; width: 75px; height: 75px; font-size: 28px;" onclick="terminateActiveSession(true)">❌</button>
    </div>

</div>

<script>
    const socket = io();
    let currentSessionUser = null;
    let currentSessionUid = "";
    let typedCallString = "";
    let webrtcPeerConnection = null;
    let localMicAudioStream = null;
    let currentRemoteActiveTarget = "";
    let callTimerInterval = null;
    let totalSeconds = 0;
    let deferredPrompt = null;

    // PWA Installation Core Engine
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredPrompt = e;
        document.getElementById('pwa-install-btn').style.display = 'block';
    });
    document.getElementById('pwa-install-btn').addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') document.getElementById('pwa-install-btn').style.display = 'none';
            });
        }
    });

    function executeAuthentication() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                document.getElementById('panel-login').classList.remove('active-panel');
                if (data.role === "admin") {
                    document.getElementById('panel-admin').classList.add('active-panel');
                    renderAdminDatabaseTable(data.users);
                } else {
                    currentSessionUid = username;
                    currentSessionUser = data.user;
                    document.getElementById('panel-user-app').style.display = 'flex';
                    
                    document.getElementById('lbl-cust-name').innerText = currentSessionUser.name || username;
                    document.getElementById('lbl-ip-num').innerText = username;
                    document.getElementById('lbl-live-bal').innerText = "BDT " + currentSessionUser.balance;

                    socket.emit('register-node', currentSessionUid);
                    loadContactProfiles();
                    syncUserDatabaseState(currentSessionUser.balance, currentSessionUser.logs || []);
                    userRoute('dialpad');
                }
            } else { alert(data.message); }
        });
    }

    function renderAdminDatabaseTable(users) {
        const box = document.getElementById('admin-db-list-view'); box.innerHTML = "";
        for (let u in users) {
            box.innerHTML += `<div class="input-3d" style="display:flex; justify-content:space-between; align-items:center; margin:0;" onclick="populateAdminForm('${u}','${users[u].name}','${users[u].password}','${users[u].balance}')">
                <div><strong>${users[u].name}</strong><br><small>Node: ${u} | BDT ${users[u].balance}</small></div>
                <span style="color:#0066cc; font-weight:bold;">Edit</span>
            </div>`;
        }
    }

    function populateAdminForm(u, n, p, b) {
        document.getElementById('adm-uid').value = u;
        document.getElementById('adm-name').value = n;
        document.getElementById('adm-pass').value = p;
        document.getElementById('adm-bal').value = b;
    }

    function adminCommitUser() {
        const adminUser = document.getElementById('login-user').value.trim();
        const adminPass = document.getElementById('login-pass').value.trim();
        const targetUser = document.getElementById('adm-uid').value.trim();
        const name = document.getElementById('adm-name').value.trim();
        const password = document.getElementById('adm-pass').value.trim();
        const balance = document.getElementById('adm-bal').value.trim();

        fetch('/api/admin/save-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminUser, adminPass, targetUser, name, password, balance })
        }).then(res => res.json()).then(data => {
            if(data.success) { alert("User Saved."); renderAdminDatabaseTable(data.users); clearAdminInputs(); }
        });
    }

    function adminDeleteUser() {
        const adminUser = document.getElementById('login-user').value.trim();
        const adminPass = document.getElementById('login-pass').value.trim();
        const targetUser = document.getElementById('adm-uid').value.trim();

        fetch('/api/admin/delete-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminUser, adminPass, targetUser })
        }).then(res => res.json()).then(data => {
            if(data.success) { alert("User Deleted."); renderAdminDatabaseTable(data.users); clearAdminInputs(); }
        });
    }

    function clearAdminInputs() {
        document.getElementById('adm-uid').value = ""; document.getElementById('adm-name').value = "";
        document.getElementById('adm-pass').value = ""; document.getElementById('adm-bal').value = "";
    }

    function dialAppend(n) { typedCallString += n; renderDialScreen(); }
    function dialBackspace() { typedCallString = typedCallString.slice(0, -1); renderDialScreen(); }
    function renderDialScreen() { document.getElementById('dial-display-box').value = typedCallString; }

    function userRoute(p) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active-tab'));
        document.getElementById('panel-user-app').querySelectorAll('.screen-panel').forEach(panel => panel.classList.remove('active-panel'));
        document.getElementById('tab-' + p).classList.add('active-tab');
        document.getElementById('user-' + p).classList.add('active-panel');
        document.getElementById('app-view-title').innerText = p.toUpperCase();
    }

    function triggerIVRSystem() {
        const speech = new SpeechSynthesisUtterance(`আপনার বর্তমান ব্যালেন্স হচ্ছে ${currentSessionUser.balance} টাকা।`);
        speech.lang = 'bn-BD'; speech.rate = 0.9;
        document.getElementById('call-view-target-num').innerText = "123";
        document.getElementById('call-view-status').innerText = "Playing Balance IVR System Stream...";
        document.getElementById('call-overlay-window').style.display = 'flex';
        window.speechSynthesis.speak(speech);
        speech.onend = () => { terminateActiveSession(false); };
    }

    function openCallOptions(type) {
        if(!typedCallString) return;
        if(typedCallString === "123") { return triggerIVRSystem(); }
        initiateVoiceOutbound(type);
    }

    function startCallTimer() {
        totalSeconds = 0; const timerBox = document.getElementById('call-live-timer');
        timerBox.style.display = 'block'; timerBox.innerText = "00:00";
        callTimerInterval = setInterval(() => {
            totalSeconds++;
            let min = Math.floor(totalSeconds / 60); let sec = totalSeconds % 60;
            timerBox.innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
        }, 1000);
    }

    function initiateVoiceOutbound(type) {
        currentRemoteActiveTarget = typedCallString;
        const constraints = { audio: true, video: type === 'video' ? { width: 1280, height: 720, facingMode: "user" } : false };

        navigator.mediaDevices.getUserMedia(constraints).then(stream => {
            localMicAudioStream = stream;
            document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
            document.getElementById('call-overlay-window').style.display = 'flex';

            if(type === 'video') document.getElementById('video-stream-container').style.display = 'block';

            webrtcPeerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            stream.getTracks().forEach(track => webrtcPeerConnection.addTrack(track, stream));

            webrtcPeerConnection.ontrack = (e) => {
                if(type === 'video') document.getElementById('remoteVideoTrack').srcObject = e.streams[0];
                else document.getElementById('remoteAudioNode').srcObject = e.streams[0];
            };

            webrtcPeerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', { target: currentRemoteActiveTarget, candidate: event.candidate });
            };

            webrtcPeerConnection.createOffer().then(offer => webrtcPeerConnection.setLocalDescription(offer)).then(() => {
                socket.emit('call-node', { target: currentRemoteActiveTarget, from: currentSessionUid, offer: webrtcPeerConnection.localDescription, callType: type });
            });
        });
    }

    socket.on('incoming-call', (data) => {
        currentRemoteActiveTarget = data.from;
        let accept = confirm(`Incoming ${data.callType.toUpperCase()} Call from Node: ${data.from}. Answer?`);
        if(accept) {
            const constraints = { audio: true, video: data.callType === 'video' ? { width: 1280, height: 720 } : false };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                localMicAudioStream = stream;
                document.getElementById('call-view-target-num').innerText = currentRemoteActiveTarget;
                document.getElementById('call-overlay-window').style.display = 'flex';
                
                if(data.callType === 'video') document.getElementById('video-stream-container').style.display = 'block';

                webrtcPeerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                stream.getTracks().forEach(track => webrtcPeerConnection.addTrack(track, stream));

                webrtcPeerConnection.ontrack = (e) => {
                    if(data.callType === 'video') document.getElementById('remoteVideoTrack').srcObject = e.streams[0];
                    else document.getElementById('remoteAudioNode').srcObject = e.streams[0];
                };

                webrtcPeerConnection.onicecandidate = (event) => {
                    if (event.candidate) socket.emit('ice-candidate', { target: currentRemoteActiveTarget, candidate: event.candidate });
                };

                webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.offer)).then(() => {
                    return webrtcPeerConnection.createAnswer();
                }).then(ans => {
                    return webrtcPeerConnection.setLocalDescription(ans);
                }).then(() => {
                    socket.emit('call-accept', { target: currentRemoteActiveTarget, answer: webrtcPeerConnection.localDescription });
                    startCallTimer();
                });
            });
        } else { socket.emit('hangup-call', { target: currentRemoteActiveTarget }); }
    });

    socket.on('call-connected', (data) => {
        document.getElementById('call-view-status').innerText = "Active Network Stream Connected";
        webrtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        startCallTimer();
    });

    socket.on('ice-candidate', (data) => {
        if (webrtcPeerConnection && data.candidate) webrtcPeerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
    });

    function dispatchSecureMessage() {
        const to = document.getElementById('chat-recipient').value.trim();
        const text = document.getElementById('chat-text-payload').value.trim();
        if(!to || !text) return;
        socket.emit('send-msg', { to, from: currentSessionUid, text });
        appendMessage(currentSessionUid, text);
        document.getElementById('chat-text-payload').value = "";
    }

    socket.on('receive-msg', (data) => { appendMessage(data.from, data.text); });

    function appendMessage(sender, text) {
        const box = document.getElementById('chat-stream-render');
        const isMe = sender === currentSessionUid;
        box.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-out' : 'msg-in'}"><strong>${isMe ? 'Me' : sender}:</strong> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function trigger3DRefillRequest() {
        const amt = document.getElementById('refill-input').value;
        if(!amt || amt <= 0) return alert("Enter valid configuration amount.");
        fetch('/api/user/request-balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentSessionUid, name: currentSessionUser.name, currentBalance: currentSessionUser.balance, amount: amt })
        }).then(() => { alert("Refill Signal Transmitted to Telegram Pipeline."); document.getElementById('refill-input').value = ""; });
    }

    function loadContactProfiles() {
        fetch('/api/users-list').then(res => res.json()).then(users => {
            const box = document.getElementById('contacts-render-box'); box.innerHTML = "";
            for(let u in users) {
                box.innerHTML += `<div class="input-3d" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin:0;" onclick="typedCallString='${u}'; renderDialScreen(); userRoute('dialpad');">
                    <div><strong>${users[u].name}</strong><br><small style="color:#718096;">Node ID: ${u}</small></div>
                    <span style="font-size:20px;">📞</span>
                </div>`;
            }
        });
    }

    function syncUserDatabaseState(bal, logs) {
        document.getElementById('lbl-live-bal').innerText = "BDT " + bal;
        const logBox = document.getElementById('logs-list-render'); logBox.innerHTML = "";
        logs.forEach(l => {
            logBox.innerHTML += `<div class="input-3d" style="margin:0;">Dialed Node: <strong>${l.target}</strong><br><small style="color:#a0aec0;">${l.time}</small></div>`;
        });
    }

    socket.on('balance-sync', (d) => { document.getElementById('lbl-live-bal').innerText = "BDT " + d.balance; });
    socket.on('call-terminated', () => { terminateActiveSession(false); });
    socket.on('force-hangup', () => { terminateActiveSession(false); alert("Insufficient Credit Balance."); });
    socket.on('call-error', (d) => { alert(d.message === "offline" ? "Target Node is Offline." : "Credit Insufficient."); terminateActiveSession(false); });

    function terminateActiveSession(notify) {
        if(notify && currentRemoteActiveTarget) socket.emit('hangup-call', { target: currentRemoteActiveTarget });
        if(callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        if(webrtcPeerConnection) { webrtcPeerConnection.close(); webrtcPeerConnection = null; }
        if(localMicAudioStream) { localMicAudioStream.getTracks().forEach(t => t.stop()); localMicAudioStream = null; }
        window.speechSynthesis.cancel();
        document.getElementById('call-overlay-window').style.display = 'none';
        document.getElementById('video-stream-container').style.display = 'none';
        document.getElementById('call-live-timer').style.display = 'none';
    }
</script>
</body>
</html>
