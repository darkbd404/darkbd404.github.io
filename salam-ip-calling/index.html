<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D IP Calling Engine Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="/socket.io/socket.io.js"></script>
    <!-- আপনার আগের সব CSS এখানেই থাকবে -->
    <style>
        /* ... আপনার অরিজিনাল CSS ... */
        :root { --primary: #0066cc; --dark-bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --accent: #38bdf8; --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        /* ... বাকি CSS হুবহু আগের মতো ... */
    </style>
</head>
<body>
    <!-- আপনার অরিজিনাল HTML Body Content হুবহু এখানে থাকবে -->
    <div id="login-screen">...</div>
    <div id="app-container">...</div>
    
    <!-- ✅ শুধুমাত্র এই স্ক্রিপ্টটি </body> এর আগে যোগ করুন -->
    <script>
        // PWA Notification Permission & Handler
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") showToast("System", "Notifications Enabled!");
                });
            }
        }

        function sendBrowserNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { 
                    body: body, 
                    icon: "https://cdn-icons-png.flaticon.com/512/5585/5585856.png",
                    badge: "https://cdn-icons-png.flaticon.com/512/5585/5585856.png"
                });
            }
        }

        function showToast(title, message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 9999;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white; padding: 15px 20px; border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s ease;
                max-width: 300px; font-family: sans-serif;
            `;
            toast.innerHTML = `<strong>${title}</strong><br>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // Socket Listener for Notifications
        if(typeof socket !== 'undefined') {
            socket.on('system-notification', (data) => {
                sendBrowserNotification(data.title, data.message);
                showToast(data.title, data.message);
            });
        }

        // Call permission on load
        window.addEventListener('load', requestNotificationPermission);
    </script>
</body>
</html>
