<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার তালিকা অনুসন্ধান</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006a4e;
            --secondary: #f42a41;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333;
            --text-light: #666;
            --border: #e0e0e0;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Header Design */
        .header {
            background: linear-gradient(135deg, #fff 0%, #f9f9f9 100%);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-top: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,106,78,0.03) 0%, transparent 70%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .logo { width: 80px; margin-bottom: 15px; position: relative; z-index: 1; }
        .header h1 { font-size: 26px; color: var(--primary); margin-bottom: 5px; position: relative; z-index: 1; }
        .header h2 { font-size: 18px; color: var(--text); font-weight: 600; position: relative; z-index: 1; }
        .header-meta { 
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; 
            margin-top: 10px; font-size: 13px; color: var(--text-light); position: relative; z-index: 1;
        }
        .meta-badge { background: #eefbf7; padding: 4px 12px; border-radius: 20px; border: 1px solid #cceadd; }

        /* Search Box */
        .search-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { position: relative; }
        
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 106, 78, 0.1);
            transform: translateY(-2px);
        }

        .btn-search {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 106, 78, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-search:hover { background: #00523d; transform: translateY(-2px); }
        .btn-search:active { transform: translateY(0); }
        .btn-search:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        /* Loading & Status */
        .loader-container { text-align: center; padding: 30px; display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-msg { 
            background: #fff5f5; color: #c53030; padding: 15px; 
            border-radius: 8px; border-left: 5px solid #c53030; 
            display: none; margin-bottom: 20px; font-size: 14px;
        }

        /* Result Card */
        .result-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #eee;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-header {
            background: linear-gradient(to right, #f8f9fa, #fff);
            padding: 15px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h3 { font-size: 18px; color: var(--primary); font-weight: 700; }
        .badge-voter {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body { padding: 25px; }
        
        .info-section-title {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #f0f0f0;
            display: inline-block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .info-item { 
            background: #fafafa; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #f0f0f0;
            transition: 0.2s;
        }
        .info-item:hover { border-color: #ddd; background: #fff; }

        .info-label { font-size: 12px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-size: 15px; color: #333; font-weight: 600; word-break: break-word; }

        .no-data { text-align: center; padding: 40px; color: #777; display: none; font-size: 16px; }
        
        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .header h1 { font-size: 20px; }
            .input-grid { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <img src="./logo-ec.png" alt="EC Logo" class="logo">
        <h1 id="orgName">বাংলাদেশ নির্বাচন কমিশন</h1>
        <h2 id="docTitle">ভোটার তালিকা</h2>
        <div class="header-meta">
            <span class="meta-badge" id="docType">ছবি ছাড়া চূড়ান্ত ভোটার তালিকা</span>
            <span class="meta-badge" id="formNo">ফরম-১</span>
        </div>
    </div>

    <!-- Error Message Area -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- Search Form -->
    <div class="search-box">
        <div class="input-grid">
            <div class="input-group">
                <label>ভোটারের নাম</label>
                <input type="text" id="sName" placeholder="পুরো নাম লিখুন">
            </div>
            <div class="input-group">
                <label>পিতার নাম</label>
                <input type="text" id="sFather" placeholder="পিতার নাম">
            </div>
            <div class="input-group">
                <label>মাতার নাম</label>
                <input type="text" id="sMother" placeholder="মাতার নাম">
            </div>
            <div class="input-group">
                <label>জন্ম তারিখ</label>
                <input type="date" id="sDob">
            </div>
            <div class="input-group">
                <label>লিঙ্গ নির্বাচন করুন</label>
                <select id="sGender" onchange="handleGenderChange()">
                    <option value="" disabled selected>-- লিঙ্গ নির্বাচন করুন --</option>
                    <option value="male">পুরুষ</option>
                    <option value="female">মহিলা</option>
                </select>
            </div>
        </div>
        <button class="btn-search" id="searchBtn" onclick="performSearch()" disabled>অনুসন্ধান করুন</button>
    </div>

    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <p>ডাটাবেস লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন</p>
    </div>

    <!-- Results Area -->
    <div id="resultsArea"></div>
    <div class="no-data" id="noData">দুঃখিত, কোনো তথ্য পাওয়া যায়নি</div>
</div>

<script>
    let dbData = null;
    let currentGender = '';
    
    // ফাইলের নাম কনফিগারেশন
    const DB_FILES = {
        male: './falkamuri_male.json',
        female: './falkamuri_female.json'
    };

    // পেজ লোড হলে কিছুই করবে না, ইউজারকে জেন্ডার সিলেক্ট করতে হবে
    window.onload = function() {
        document.getElementById('searchBtn').disabled = true;
    };

    // জেন্ডার পরিবর্তন হলে ডাটা লোড ফাংশন
    async function handleGenderChange() {
        const genderSelect = document.getElementById('sGender');
        const btn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('errorMsg');
        const resultsArea = document.getElementById('resultsArea');
        
        currentGender = genderSelect.value;
        
        // রিসেট
        dbData = null;
        resultsArea.innerHTML = '';
        errorDiv.style.display = 'none';
        btn.disabled = true;
        loader.style.display = 'block';

        try {
            const filePath = DB_FILES[currentGender];
            // Cache busting for fresh data
            const response = await fetch(filePath + '?t=' + Date.now());
            
            if (!response.ok) throw new Error(`ফাইল পাওয়া যায়নি: ${filePath}`);
            
            dbData = await response.json();
            
            // হেডার আপডেট (যদি ডাটায় থাকে)
            if(dbData.organization) document.getElementById('orgName').innerText = dbData.organization;
            if(dbData.document_title) document.getElementById('docTitle').innerText = dbData.document_title;
            if(dbData.type) document.getElementById('docType').innerText = dbData.type;
            
            loader.style.display = 'none';
            btn.disabled = false;
            
        } catch (error) {
            loader.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `<strong>ত্রুটি:</strong> ${currentGender === 'male' ? 'পুরুষ' : 'মহিলা'} ডাটাবেস লোড করা সম্ভব হয়নি।<br>${error.message}<br><small>নিশ্চিত করুন ফাইলটি সঠিক নামে ফোল্ডারে আছে।</small>`;
        }
    }

    function performSearch() {
        if (!dbData || !dbData.voters) return;

        const sName = document.getElementById('sName').value.toLowerCase().trim();
        const sFather = document.getElementById('sFather').value.toLowerCase().trim();
        const sMother = document.getElementById('sMother').value.toLowerCase().trim();
        const sDob = document.getElementById('sDob').value; // Format YYYY-MM-DD

        // ফিল্টার লজিক
        const results = dbData.voters.filter(v => {
            const matchName = !sName || (v.name && v.name.toLowerCase().includes(sName));
            const matchFather = !sFather || (v.father_name && v.father_name.toLowerCase().includes(sFather));
            const matchMother = !sMother || (v.mother_name && v.mother_name.toLowerCase().includes(sMother));
            
            // DOB Matching Logic (Handling different formats if necessary, assuming standard ISO or DD-MM-YYYY in JSON)
            let matchDob = true;
            if (sDob) {
                // Simple check: if JSON has DOB and it includes the selected date string
                // Note: Real world DOB matching might need parsing depending on JSON format
                matchDob = v.date_of_birth && v.date_of_birth.includes(sDob); 
            }

            return matchName && matchFather && matchMother && matchDob;
        });

        renderResults(results);
    }

    function renderResults(data) {
        const container = document.getElementById('resultsArea');
        const noDataMsg = document.getElementById('noData');
        container.innerHTML = '';

        if (data.length === 0) {
            noDataMsg.style.display = 'block';
            return;
        }
        noDataMsg.style.display = 'none';

        // Display Document Meta Info at top of results if available
        let metaHtml = '';
        if(dbData.total_voters || dbData.publication_date) {
            metaHtml = `
                <div style="margin-bottom: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; border-left: 4px solid #006a4e;">
                    <p><strong>মোট ভোটার:</strong> ${dbData.total_voters || 'N/A'} | <strong>প্রকাশের তারিখ:</strong> ${dbData.publication_date || 'N/A'}</p>
                    <p><strong>এলাকা:</strong> ${dbData.voter_area_name || ''} (${dbData.voter_area_number || ''})</p>
                </div>
            `;
        }
        container.innerHTML = metaHtml;

        data.forEach((v) => {
            const html = `
                <div class="result-card">
                    <div class="card-header">
                        <h3>${v.name || 'অজানা'}</h3>
                        <span class="badge-voter">ID: ${v.voter_no || 'N/A'}</span>
                    </div>
                    <div class="card-body">
                        <div class="info-section-title">ব্যক্তিগত তথ্য</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">পিতার নাম</div><div class="info-value">${v.father_name || '-'}</div></div>
                            <div class="info-item"><div class="info-label">মাতার নাম</div><div class="info-value">${v.mother_name || '-'}</div></div>
                            <div class="info-item"><div class="info-label">জন্ম তারিখ</div><div class="info-value">${v.date_of_birth || '-'}</div></div>
                            <div class="info-item"><div class="info-label">লিঙ্গ</div><div class="info-value">${v.gender || '-'}</div></div>
                            <div class="info-item"><div class="info-label">পেশা</div><div class="info-value">${v.occupation || '-'}</div></div>
                        </div>

                        <div class="info-section-title" style="margin-top: 20px;">ঠিকানা ও অন্যান্য</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">ঠিকানা</div><div class="info-value">${v.address || '-'}</div></div>
                            <div class="info-item"><div class="info-label">জেলা</div><div class="info-value">${v.district || '-'}</div></div>
                            <div class="info-item"><div class="info-label">উপজেলা/থানা</div><div class="info-value">${v.upazila_thana || '-'}</div></div>
                            <div class="info-item"><div class="info-label">ইউনিয়ন/ওয়ার্ড</div><div class="info-value">${v.union_ward_cantonment || '-'}</div></div>
                            <div class="info-item"><div class="info-label">পোস্ট অফিস</div><div class="info-value">${v.post_office || '-'}</div></div>
                            <div class="info-item"><div class="info-label">পোস্ট কোড</div><div class="info-value">${v.post_code || '-'}</div></div>
                            <div class="info-item"><div class="info-label">ভোটার এলাকা</div><div class="info-value">${v.voter_area_name || '-'}</div></div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }
</script>

</body>
</html>
