<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার তালিকা অনুসন্ধান</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006a4e;
            --secondary: #f42a41;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* Header */
        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-top: 5px solid var(--primary);
            position: relative;
        }
        .logo { width: 90px; margin-bottom: 15px; }
        .header h1 { font-size: 24px; color: var(--primary); margin-bottom: 5px; font-weight: 700; }
        .header h2 { font-size: 18px; color: var(--text); font-weight: 600; margin-bottom: 15px; }
        
        .doc-meta {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .meta-tag {
            background: #edf2f7;
            color: var(--text);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #cbd5e0;
        }

        /* Search Box */
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 106, 78, 0.1);
        }
        .btn-search {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-search:hover { background: #00523d; transform: translateY(-1px); }
        .btn-search:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; }

        /* Loader & Error */
        .loader { text-align: center; padding: 20px; display: none; }
        .spinner {
            width: 35px; height: 35px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-msg { 
            background: #fff5f5; color: #c53030; padding: 15px; 
            border-radius: 8px; border: 1px solid #feb2b2; display: none; 
            text-align: center; margin-bottom: 20px;
        }

        /* Results */
        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
            border: 1px solid var(--border);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-header {
            background: #f7fafc;
            padding: 15px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 { font-size: 18px; color: var(--primary); font-weight: 700; }
        .badge-id {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .card-body { padding: 25px; }
        
        .section-title {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #edf2f7;
            display: inline-block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .info-item {
            background: #fdfdfd;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #edf2f7;
        }
        .info-label { font-size: 12px; color: #a0aec0; margin-bottom: 4px; font-weight: 500; }
        .info-value { font-size: 15px; color: #2d3748; font-weight: 600; }

        .no-data { text-align: center; padding: 40px; color: #718096; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <img src="./logo-ec.png" alt="Logo" class="logo">
        <h1 id="orgName">বাংলাদেশ নির্বাচন কমিশন</h1>
        <h2 id="docTitle">ভোটার তালিকা</h2>
        <div class="doc-meta">
            <span class="meta-tag" id="docType">ছবি ছাড়া চূড়ান্ত ভোটার তালিকা</span>
            <span class="meta-tag" id="formNo">ফরম-১</span>
            <span class="meta-tag" id="pubDate">প্রকাশের তারিখ: -</span>
        </div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- Search Form -->
    <div class="search-box">
        <div class="input-grid">
            <div class="input-group">
                <label>ভোটারের নাম</label>
                <input type="text" id="sName" placeholder="পুরো নাম লিখুন">
            </div>
            <div class="input-group">
                <label>পিতার নাম</label>
                <input type="text" id="sFather" placeholder="পিতার নাম">
            </div>
            <div class="input-group">
                <label>মাতার নাম</label>
                <input type="text" id="sMother" placeholder="মাতার নাম">
            </div>
            <div class="input-group">
                <label>জন্ম তারিখ</label>
                <input type="date" id="sDob">
            </div>
            <div class="input-group">
                <label>লিঙ্গ নির্বাচন করুন</label>
                <select id="sGender" onchange="handleGenderChange()">
                    <option value="" disabled selected>-- লিঙ্গ নির্বাচন করুন --</option>
                    <option value="male">পুরুষ</option>
                    <option value="female">মহিলা</option>
                </select>
            </div>
        </div>
        <button class="btn-search" id="searchBtn" onclick="performSearch()" disabled>অনুসন্ধান করুন</button>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>ডাটাবেস লোড হচ্ছে...</p>
    </div>

    <!-- Results Area -->
    <div id="resultsArea"></div>
    <div class="no-data" id="noData">কোনো তথ্য পাওয়া যায়নি</div>
</div>

<script>
    let dbData = null;
    let headerInfo = {}; // Store header info separately
    
    const DB_FILES = {
        male: './falkamuri_male.json',
        female: './falkamuri_female.json'
    };

    window.onload = function() {
        document.getElementById('searchBtn').disabled = true;
    };

    async function handleGenderChange() {
        const genderSelect = document.getElementById('sGender');
        const btn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('errorMsg');
        const resultsArea = document.getElementById('resultsArea');
        
        const gender = genderSelect.value;
        
        // Reset UI
        dbData = null;
        headerInfo = {};
        resultsArea.innerHTML = '';
        errorDiv.style.display = 'none';
        btn.disabled = true;
        loader.style.display = 'block';

        try {
            const response = await fetch(DB_FILES[gender] + '?t=' + Date.now());
            
            if (!response.ok) throw new Error(`ফাইল পাওয়া যায়নি: ${DB_FILES[gender]}`);
            
            const jsonData = await response.json();
            
            // Structure Handling based on your provided JSON
            // Assuming structure: { organization: "...", document_header: {...}, voters: [...] }
            
            dbData = jsonData.voters || [];
            headerInfo = jsonData.document_header || {};
            
            // Update Header UI with real data
            if(jsonData.organization) document.getElementById('orgName').innerText = jsonData.organization;
            if(jsonData.document_title) document.getElementById('docTitle').innerText = jsonData.document_title;
            
            if(headerInfo.type) document.getElementById('docType').innerText = headerInfo.type;
            if(headerInfo.form) document.getElementById('formNo').innerText = headerInfo.form;
            if(headerInfo.publication_date) document.getElementById('pubDate').innerText = "প্রকাশের তারিখ: " + headerInfo.publication_date;

            loader.style.display = 'none';
            btn.disabled = false;
            
        } catch (error) {
            loader.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `<strong>ত্রুটি:</strong> ডাটাবেস লোড ব্যর্থ।<br>${error.message}`;
            console.error(error);
        }
    }

    function performSearch() {
        if (!dbData) return;

        const sName = document.getElementById('sName').value.toLowerCase().trim();
        const sFather = document.getElementById('sFather').value.toLowerCase().trim();
        const sMother = document.getElementById('sMother').value.toLowerCase().trim();
        const sDob = document.getElementById('sDob').value;

        const results = dbData.filter(v => {
            const matchName = !sName || (v.name && v.name.toLowerCase().includes(sName));
            const matchFather = !sFather || (v.father_name && v.father_name.toLowerCase().includes(sFather));
            const matchMother = !sMother || (v.mother_name && v.mother_name.toLowerCase().includes(sMother));
            
            let matchDob = true;
            if (sDob) {
                // Handle potential format differences if necessary, currently assuming simple includes
                matchDob = v.date_of_birth && v.date_of_birth.includes(sDob); 
            }

            return matchName && matchFather && matchMother && matchDob;
        });

        renderResults(results);
    }

    function renderResults(data) {
        const container = document.getElementById('resultsArea');
        const noDataMsg = document.getElementById('noData');
        container.innerHTML = '';

        if (data.length === 0) {
            noDataMsg.style.display = 'block';
            return;
        }
        noDataMsg.style.display = 'none';

        data.forEach((v) => {
            // Merge voter specific data with header data for display if voter data is missing
            // But usually voter card has its own address. If not, fallback to headerInfo.
            
            const district = v.district || headerInfo.district || '-';
            const upazila = v.upazila_thana || headerInfo.upazila_thana || '-';
            const union = v.union_ward_cantonment || headerInfo.union_ward_cantonment || '-';
            const postOffice = v.post_office || headerInfo.post_office || '-';
            const postCode = v.post_code || headerInfo.post_code || '-';
            const voterArea = v.voter_area_name || headerInfo.voter_area_name || '-';

            const html = `
                <div class="result-card">
                    <div class="card-header">
                        <h3>${v.name || 'অজানা'}</h3>
                        <span class="badge-id">ভোটার নং: ${v.voter_no || 'N/A'}</span>
                    </div>
                    <div class="card-body">
                        <div class="section-title">ব্যক্তিগত তথ্য</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">পিতার নাম</div><div class="info-value">${v.father_name || '-'}</div></div>
                            <div class="info-item"><div class="info-label">মাতার নাম</div><div class="info-value">${v.mother_name || '-'}</div></div>
                            <div class="info-item"><div class="info-label">জন্ম তারিখ</div><div class="info-value">${v.date_of_birth || '-'}</div></div>
                            <div class="info-item"><div class="info-label">লিঙ্গ</div><div class="info-value">${v.gender || headerInfo.gender || '-'}</div></div>
                            <div class="info-item"><div class="info-label">পেশা</div><div class="info-value">${v.occupation || '-'}</div></div>
                        </div>

                        <div class="section-title" style="margin-top: 20px;">ঠিকানা ও অন্যান্য</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">জেলা</div><div class="info-value">${district}</div></div>
                            <div class="info-item"><div class="info-label">উপজেলা/থানা</div><div class="info-value">${upazila}</div></div>
                            <div class="info-item"><div class="info-label">ইউনিয়ন/ওয়ার্ড</div><div class="info-value">${union}</div></div>
                            <div class="info-item"><div class="info-label">পোস্ট অফিস</div><div class="info-value">${postOffice}</div></div>
                            <div class="info-item"><div class="info-label">পোস্ট কোড</div><div class="info-value">${postCode}</div></div>
                            <div class="info-item"><div class="info-label">ভোটার এলাকা</div><div class="info-value">${voterArea}</div></div>
                            <div class="info-item"><div class="info-label">ঠিকানা</div><div class="info-value">${v.address || '-'}</div></div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }
</script>

</body>
</html>
