    <style>
        /* Premium Neumorphic Dark/Light Mode Core */
        :root {
            --bg-color: #0d0a1b;
            --surface: #130f26;
            --shadow-outer-dark: #05040a;
            --shadow-outer-light: rgba(255, 255, 255, 0.03);
            --shadow-inner-dark: inset 4px 4px 9px #05040a;
            --shadow-inner-light: inset -4px -4px 9px rgba(255, 255, 255, 0.03);
            --text-main: #e6e1f7;
            --text-sub: #6c648a;
            --accent: #ff0055;
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --border-highlight: rgba(255, 255, 255, 0.02);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #e0e5ec;
                --surface: #e0e5ec;
                --shadow-outer-dark: #a3b1c6;
                --shadow-outer-light: #ffffff;
                --shadow-inner-dark: inset 4px 4px 8px #a3b1c6;
                --shadow-inner-light: inset -4px -4px 8px #ffffff;
                --text-main: #2b3442;
                --text-sub: #6b778c;
                --accent: #d10043;
                --neon-blue: #008fa8;
                --neon-green: #00993d;
                --accent-glow: rgba(209, 0, 67, 0.2);
                --border-highlight: rgba(255, 255, 255, 0.6);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px 8px;
            transition: background 0.3s ease;
        }

        /* 3D Main Canvas Chassis Frame */
        .mainframe-3d-canvas {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 26px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-highlight);
            box-shadow: 12px 12px 24px var(--shadow-outer-dark), 
                        -12px -12px 24px var(--shadow-outer-light);
        }

        /* 1. CINEMATIC IN-SCREEN PLAYER CHASSIS */
        .cinema-viewport-large {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-inner-dark), var(--shadow-inner-light);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* BRANDING OVERLAY - NO BACKGROUND & POSITIONED FURTHER RIGHT & DOWN */
        .in-viewport-salam-bar {
            position: absolute;
            bottom: 10px; 
            right: 6px; /* Moved further right as requested */
            background: transparent !important; /* Removed black background completely */
            padding: 4px;
            display: flex;
            gap: 2px;
            z-index: 2147483647 !important;
            pointer-events: none;
            box-shadow: none !important;
            border: none !important;
        }

        .in-viewport-salam-bar span {
            font-size: 11px;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            display: inline-block;
            opacity: 0;
            transform: scale(0.7);
            animation: wordWave 3.5s infinite ease-in-out;
        }

        @keyframes wordWave {
            0%, 100% { opacity: 0.6; transform: scale(0.9); text-shadow: none; color: var(--text-sub); }
            5%, 25% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 8px var(--accent-glow); color: var(--accent); }
            30%, 95% { opacity: 1; transform: scale(1); text-shadow: none; color: var(--accent); }
        }

        .media-placeholder-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #06040a;
            z-index: 6; text-align: center;
        }
        .media-placeholder-layer i { font-size: 32px; color: var(--accent); margin-bottom: 6px; }

        /* 2. REAL-TIME MULTICAST METRICS DATA LOG MONITOR */
        .compact-live-monitor-bar {
            padding: 10px 12px;
            border-radius: 14px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-inner-dark), var(--shadow-inner-light);
        }
        .compact-live-monitor-bar img { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; }
        .compact-live-monitor-bar h4 { font-size: 12px; font-weight: 700; color: var(--text-main); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .total-nodes-badge {
            font-size: 8px; font-weight: 800; color: var(--neon-blue);
            padding: 4px 8px; border-radius: 6px;
            background: var(--surface);
            box-shadow: 2px 2px 5px var(--shadow-outer-dark);

        .live-status-flash { display: flex; align-items: center; gap: 4px; font-size: 8px; color: var(--accent); font-weight: 700; }
        .pulse-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: pulseRhythm 1s infinite; }
        @keyframes pulseRhythm { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* 3. ALGORITHMIC TELEMETRY MATRIX BLOCK */
        .quick-server-micro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .micro-server-node {
            border-radius: 12px; padding: 8px;
            display: flex; flex-direction: column; gap: 1px;

                        -4px -4px 8px var(--shadow-outer-light);

        .micro-lbl { font-size: 8px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
        .micro-val { font-size: 11px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* System Pipeline Loader */
        .server-sync-status-box {
            border-radius: 12px; padding: 11px; text-align: center;
            font-size: 10px; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: var(--shadow-inner-dark), var(--shadow-inner-light);
        }

        /* 4. STATION CONSOLE MODULE SELECTION HUB */
        .permanent-channels-station {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-swapping-category-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 6px 2px;
            scroll-behavior: smooth;
        }
        .side-swapping-category-strip::-webkit-scrollbar { height: 3px; }
        .side-swapping-category-strip::-webkit-scrollbar-thumb { background: var(--text-sub); border-radius: 10px; }
        
        .ultra-3d-pill {
            flex: 0 0 auto;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            background: var(--surface);
            border: 1px solid var(--border-highlight);
            box-shadow: 3px 3px 6px var(--shadow-outer-dark), 
                        -3px -3px 6px var(--shadow-outer-light);
            transition: all 0.2s ease;
        }
        .ultra-3d-pill.active {
            box-shadow: var(--shadow-inner-dark), var(--shadow-inner-light);
            color: var(--accent);
            border-color: transparent;
        }

        /* Search Structure Component */
        .search-wrapper-3d {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;

        .search-input-3d {

        /* 3-COLUMN MATRIX STRUCTURE */
        .strict-3column-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
            max-height: 340px;

        .strict-3column-matrix::-webkit-scrollbar { width: 3px; }
        .strict-3column-matrix::-webkit-scrollbar-thumb { background: var(--text-sub); border-radius: 10px; }

        /* Premium Standardized Card */
        .card-node-item {

            align-items: center;

        .card-node-item img, .card-node-item .custom-font-icon { 
            width: 34px;

        }
        
        .card-node-item span { 
            font-size: 9px; 
            color: var(--text-main); 
            text-align: center; 
            font-weight: 600; 
            width: 100%;
            padding: 0 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            word-break: break-word;

        .card-node-item:hover {

        .card-node-item:active, .card-node-item.playing {

        .card-node-item.playing span { color: var(--neon-blue); font-weight: 700; }

        /* 5. structural FOOTER PROFILE */

        .brand-copyright-txt p { font-size: 9px; color: var(--text-sub); font-weight: 600; text-align: center; }
        
        .contact-phone-numbers { display: flex; gap: 12px; justify-content: center; font-size: 9.5px; font-weight: 700; color: var(--neon-blue); }
        .contact-phone-numbers span i { margin-right: 4px; color: var(--text-sub); }

        .social-automatic-icon-row { display: flex; gap: 8px; justify-content: center; }
        .social-3d-btn {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: var(--text-main); cursor: pointer; text-decoration: none;
            background: var(--surface);
            border: 1px solid var(--border-highlight);
            box-shadow: 3px 3px 6px var(--shadow-outer-dark),

        .social-3d-btn.tg:hover { color: #0088cc; border-color: #0088cc; }
        .social-3d-btn.gm:hover { color: #ea4335; border-color: #ea4335; }
    </style>
</head>
<body>

    <script>
        // Character Split Animation Engine
        const targetStringName = "Salam Tv Network";
        const stringBoxContainer = document.getElementById('player-brand-string-box');
        
        targetStringName.split("").forEach((letter, position) => {
            const charSpan = document.createElement('span');
            charSpan.innerText = letter === " " ? "\u00A0" : letter;
            charSpan.style.animationDelay = `${position * 0.12}s`;
            stringBoxContainer.appendChild(charSpan);
        });

        // Server M3U Playlists Database Links
        const playlistFiles = [
            '338-live.m3u',
            'old-live.m3u',
            '328-live.m3u'
        ];

        // Core App Hooks
        const video = document.getElementById('video-core-engine');
        const viewportContainer = document.getElementById('player-viewport-container');
        const mainStationContainer = document.getElementById('main-station-container');
        const sideSwapPillbox = document.getElementById('side-swap-pillbox');
        const strictGridBox = document.getElementById('strict-grid-box');
        const searchBar = document.getElementById('channel-search-bar');
        const screenPlaceholder = document.getElementById('screen-placeholder');
        const totalCountBadge = document.getElementById('total-count-badge');
        const livePulseIndicator = document.getElementById('live-pulse-indicator');
        const pipelineLoader = document.getElementById('system-pipeline-loader');
        
        // Metrics Hooks
        const srvNode = document.getElementById('srv-node');
        const srvPing = document.getElementById('srv-ping');
        const srvBitrate = document.getElementById('srv-bitrate');
        const srvViewers = document.getElementById('srv-viewers');
        const srvFirewall = document.getElementById('srv-firewall');
        const srvStatus = document.getElementById('srv-status');

        let hlsEngine = null;
        let globalPlaylistDb = {};
        let registeredChannelNamesSet = new Set(); 
        let activeCategoryGlobal = '';
        let metricsLoopInterval = null;
        let currentPlayingChannelRef = null;

        const categorySchema = {
            'NEWS 📡': ['news', 'somoy', 'jamuna', 'ekattor', 'independent', 'atn', 'dbc'],
            'SPORTS ⚽': ['sports', 't-sports', 'gtv', 'gazi', 'cricket', 'football', 'sony', 'star', 'fifa'],
            'MOVIES 🍿': ['movies', 'cinema', 'action', 'hbo', 'zee', 'gold'],
            'ENTERTAINMENT 📺': ['entertainment', 'jalsha', 'bangla', 'colors', 'tv', 'zee bangla']
        };

        // Independent Async Loading Architecture
        async function bootCloudSequence() {
            globalPlaylistDb = {
                'SPORTS ⚽': [],
                'OFFLINE 🚫': []
            };
            registeredChannelNamesSet.clear();

            // Default Static Node Loading
            globalPlaylistDb['SPORTS ⚽'].push({
                id: 'fixed-default-tsports',
                name: 'FIFA T-Sports',
                url: 'http://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8',
                logo: '',
                isFontIcon: true,
                originalCategory: 'SPORTS ⚽',
                category: 'SPORTS ⚽'
            });

            const antiCacheSeed = "?timestamp=" + new Date().getTime();
            let loadedSuccessfullyCount = 0;

            // Load files concurrently & dynamically without loops breaking up
            await Promise.all(playlistFiles.map(async (fileName) => {
                try {
                    const response = await fetch(fileName + antiCacheSeed);
                    if (response.ok) {
                        const fileContent = await response.text();
                        parseSingleM3UContent(fileContent);
                        loadedSuccessfullyCount++;
                    }
                } catch (err) {
                    console.error(`Skipping file or network error on: ${fileName}`, err);
                }
            }));

            updateTotalNodesCounter();
            pipelineLoader.style.display = 'none';
            deploySwappingStation();
        }

        function parseSingleM3UContent(fileContent) {
            const lines = fileContent.split('\n');
            let currentTrack = null;
            let trackingIdCounter = Math.floor(Math.random() * 10000);

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentTrack = {};
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentTrack.logo = logoMatch ? logoMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const rawGrp = groupMatch ? groupMatch[1] : '';
                    const parts = line.split(',');
                    currentTrack.name = parts[parts.length - 1].trim() || 'Active Node';
                    
                    let targetCategory = 'OTHERS 🏷️';
                    const cleanedNameUpper = currentTrack.name.toUpperCase();

                    if (registeredChannelNamesSet.has(cleanedNameUpper)) {
                        targetCategory = 'MULTIPLE CHANNELS 🔄';
                    } else {
                        registeredChannelNamesSet.add(cleanedNameUpper);
                        const comparativeString = `${currentTrack.name} ${rawGrp}`.toUpperCase();
                        for (const [keyName, keywords] of Object.entries(categorySchema)) {
                            if (keywords.some(kw => comparativeString.includes(kw.toUpperCase()))) {
                                targetCategory = keyName;
                                break;
                            }
                        }
                    }
                    currentTrack.category = targetCategory;
                    currentTrack.originalCategory = targetCategory;
                    currentTrack.isFontIcon = false;
                    currentTrack.id = 'node-id-' + (trackingIdCounter++);
                } else if (line.startsWith('http') && currentTrack) {
                    currentTrack.url = line;
                    
                    if (!globalPlaylistDb[currentTrack.category]) {
                        globalPlaylistDb[currentTrack.category] = [];
                    }
                    globalPlaylistDb[currentTrack.category].push(currentTrack);
                    currentTrack = null;
                }
            }
        }

        function updateTotalNodesCounter() {
            let finalAbsoluteCount = 0;
            Object.keys(globalPlaylistDb).forEach(k => {
                finalAbsoluteCount += globalPlaylistDb[k].length;
            });
            totalCountBadge.innerText = `NODES: ${finalAbsoluteCount}`;
        }

        function deploySwappingStation() {
            sideSwapPillbox.innerHTML = '';
            
            const structuredKeys = Object.keys(globalPlaylistDb).sort((a, b) => {
                if(a === 'SPORTS ⚽') return -1; 
                if(b === 'SPORTS ⚽') return 1;
                if(a === 'OFFLINE 🚫') return 1;
                if(b === 'OFFLINE 🚫') return -1;
                return a.localeCompare(b);
            });

            if (!activeCategoryGlobal || !globalPlaylistDb[activeCategoryGlobal] || globalPlaylistDb[activeCategoryGlobal].length === 0) {
                activeCategoryGlobal = structuredKeys[0] || 'SPORTS ⚽';
            }

            structuredKeys.forEach((groupName) => {
                const totalInCat = globalPlaylistDb[groupName] ? globalPlaylistDb[groupName].length : 0;
                if(totalInCat === 0 && groupName !== 'OFFLINE 🚫') return;

                const pill = document.createElement('div');
                pill.className = 'ultra-3d-pill';
                if (groupName === activeCategoryGlobal) {
                    pill.classList.add('active');
                }
                pill.innerText = `${groupName} (${totalInCat})`;
                
                pill.addEventListener('click', () => {
                    document.querySelectorAll('.ultra-3d-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeCategoryGlobal = groupName;
                    searchBar.value = ''; 
                    buildStrictGrid(groupName);
                });
                sideSwapPillbox.appendChild(pill);
            });

            mainStationContainer.style.display = 'flex';
            if(!video.src && (!hlsEngine || !hlsEngine.url)) {
                screenPlaceholder.innerHTML = `<i class="fa-solid fa-play"></i><p>Chassis Active. Select Broadcast Node Below.</p>`;
            }
            buildStrictGrid(activeCategoryGlobal);
        }

        function buildStrictGrid(groupName, filterQuery = '') {
            strictGridBox.innerHTML = '';
            const channels = globalPlaylistDb[groupName] || [];

            const filteredChannels = channels.filter(channel => 
                channel.name.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if (filteredChannels.length === 0) {
                strictGridBox.innerHTML = `<div style="grid-column: span 3; text-align: center; font-size: 11px; color: var(--text-sub); padding: 20px 0;">No nodes under this selection</div>`;
                return;
            }

            filteredChannels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'card-node-item';
                if(currentPlayingChannelRef && currentPlayingChannelRef.id === channel.id) {
                    card.classList.add('playing');
                }
                
                const fallbackSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2'><rect x='2' y='7' width='20' height='15' rx='2'></rect></svg>";
                
                if(channel.isFontIcon) {
                    card.innerHTML = `<div class="custom-font-icon"><i class="fa-solid fa-trophy"></i></div><span>${channel.name}</span>`;
                } else {
                    card.innerHTML = `<img src="${channel.logo ? channel.logo : fallbackSVG}" onerror="this.src='${fallbackSVG}'"><span>${channel.name}</span>`;
                }
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.card-node-item').forEach(c => c.classList.remove('playing'));
                    card.classList.add('playing');
                    fireBroadcastTunnel(channel);
                });
                strictGridBox.appendChild(card);
            });
        }

        searchBar.addEventListener('input', (e) => {
            buildStrictGrid(activeCategoryGlobal, e.target.value);
        });

        function fireBroadcastTunnel(channel) {
            currentPlayingChannelRef = channel;
            screenPlaceholder.style.display = 'none';
            livePulseIndicator.style.display = 'flex';
            
            const fallbackSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23ff0055' stroke-width='2'><rect x='2' y='7' width='20' height='15' rx='2'></rect></svg>";
            
            document.getElementById('monitor-ch-logo').src = channel.logo && !channel.isFontIcon ? channel.logo : fallbackSVG;
            document.getElementById('monitor-ch-title').innerText = channel.name;

            window.scrollTo({ top: 0, behavior: 'smooth' });
            deployMicroTelemetry(channel.category);

            if (hlsEngine) {
                hlsEngine.destroy();
                hlsEngine = null;
            }

            if (Hls.isSupported()) {
                hlsEngine = new Hls({ 
                    enableWorker: true, 
                    lowLatencyMode: true,
                    maxBufferLength: 10,
                    manifestLoadingTimeOut: 5000, 
                    fragLoadingTimeOut: 5000
                });
                hlsEngine.loadSource(channel.url);
                hlsEngine.attachMedia(video);
                
                hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => { 
                    video.play().catch(() => {}); 
                    srvStatus.innerText = "ONLINE";
                    srvStatus.style.color = "var(--neon-green)";
                });

                hlsEngine.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        isolateOfflineNode(channel);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { 
                    video.play().catch(() => {}); 
                    srvStatus.innerText = "ONLINE";
                    srvStatus.style.color = "var(--neon-green)";
                });
                video.addEventListener('error', () => { 
                    isolateOfflineNode(channel);
                });
            }
        }

        function isolateOfflineNode(channel) {
            if (channel.category !== 'OFFLINE 🚫') {
                if(globalPlaylistDb[channel.category]) {
                    globalPlaylistDb[channel.category] = globalPlaylistDb[channel.category].filter(c => c.id !== channel.id);
                }
                
                channel.category = 'OFFLINE 🚫';
                globalPlaylistDb['OFFLINE 🚫'].push(channel);
                
                updateTotalNodesCounter();
                deploySwappingStation();
            }

            screenPlaceholder.style.display = 'flex';
            screenPlaceholder.innerHTML = `<i class="fa-solid fa-ban" style="color:var(--accent)"></i><p style="color:var(--accent); font-weight:700;">NODE OFFLINE - MOVED TO 🚫 BOX</p>`;
            killTelemetry();
        }

        function deployMicroTelemetry(categoryName) {
            if (metricsLoopInterval) clearInterval(metricsLoopInterval);
            const parsedToken = categoryName.replace(/[^\w\s]/gi, '').trim().substring(0, 5);
            srvNode.innerText = `${parsedToken || "CORE"}-M3U`;
            srvFirewall.innerText = "SHIELD SECURE";
            srvFirewall.style.color = "var(--neon-green)";
            srvStatus.innerText = "TUNING FLOW";
            srvStatus.style.color = "orange";

            let viewersCounter = Math.floor(Math.random() * (3800 - 1400)) + 1400;

            metricsLoopInterval = setInterval(() => {
                const simulatedPing = Math.floor(Math.random() * (12 - 3)) + 3;
                const simulatedBitrate = (Math.random() * (15.2 - 8.5) + 8.5).toFixed(2); 
                viewersCounter += Math.floor(Math.random() * (8 - (-8))) + (-8);

                srvPing.innerText = `${simulatedPing} ms`;
                srvBitrate.innerText = `${simulatedBitrate} Mbps`;
                srvViewers.innerText = viewersCounter.toLocaleString();
            }, 1200);
        }

        function killTelemetry() {
            if (metricsLoopInterval) clearInterval(metricsLoopInterval);
            srvNode.innerText = "DEAD LINK";
            srvPing.innerText = "0 ms";
            srvBitrate.innerText = "0.00 Mbps";
            srvViewers.innerText = "0";
            srvFirewall.innerText = "STANDBY";
            srvFirewall.style.color = "var(--text-sub)";
            srvStatus.innerText = "DISCONNECTED";
            srvStatus.style.color = "var(--accent)";
        }

        window.addEventListener('DOMContentLoaded', bootCloudSequence);
    </script>
</body>
</html>
