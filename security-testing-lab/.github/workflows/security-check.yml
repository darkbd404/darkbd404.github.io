name: Authorized Security Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check authorized target
        env:
          TARGET: ${{ vars.AUTHORIZED_TARGET }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "Set repository variable AUTHORIZED_TARGET first."
            exit 1
          fi
          echo "Testing configured authorized target: $TARGET"
          node .github/workflows/security-check.js "$TARGET"
