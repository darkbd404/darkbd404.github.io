<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Voter Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:sans-serif;background:#eef2f6;padding:15px}
.card{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:16px}
input,select,button{width:100%;padding:12px;margin:8px 0}
button{background:#006b52;color:#fff;border:0}
#loader{display:none}
canvas{width:100%;margin-top:15px;border:1px solid #ccc}
</style>
</head>
<body>
<div class="card">
<h2>ভোটার অনুসন্ধান</h2>

<input id="name" placeholder="ভোটার নাম">
<input id="father" placeholder="পিতার নাম">
<input id="mother" placeholder="মাতার নাম">
<input id="dob" placeholder="জন্ম তারিখ">

<select id="area">
<option value="ফলকামুড়ী">ফলকামুড়ী</option>
</select>

<select id="gender">
<option value="male">পুরুষ</option>
<option value="female">মহিলা</option>
</select>

<button onclick="searchVoter()">অনুসন্ধান করুন</button>
<div id="loader">লোড হচ্ছে...</div>
<div id="result"></div>
</div>

<script>
const PDF_FILES={
"ফলকামুড়ী":{
male:"pdf/falkamuri_male.pdf",
female:"pdf/falkamuri_female.pdf"
}
};

async function searchVoter(){
const area=document.getElementById("area").value;
const gender=document.getElementById("gender").value;
const name=document.getElementById("name").value.trim();

document.getElementById("loader").style.display="block";
document.getElementById("result").innerHTML="";

try{
const pdf=await pdfjsLib.getDocument(PDF_FILES[area][gender]).promise;

for(let p=1;p<=pdf.numPages;p++){
 const page=await pdf.getPage(p);
 const txt=await page.getTextContent();
 const pageText=txt.items.map(x=>x.str).join(" ");

 if(!name || pageText.includes(name)){
   const viewport=page.getViewport({scale:2});
   const canvas=document.createElement("canvas");
   canvas.width=viewport.width;
   canvas.height=viewport.height;

   await page.render({
      canvasContext:canvas.getContext("2d"),
      viewport
   }).promise;

   document.getElementById("result").appendChild(canvas);
   break;
 }
}
}catch(e){
 document.getElementById("result").innerHTML="Search Error";
 console.error(e);
}

document.getElementById("loader").style.display="none";
}
</script>
</body>
</html>
