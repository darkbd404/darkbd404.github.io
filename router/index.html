<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="referrer" content="no-referrer">
    <title>Router Admin Panel</title>

    <link rel="manifest" href='data:application/json;charset=utf-8,{"name":"Router Admin","short_name":"Router","description":"Local Router Management","start_url":"./","display":"standalone","background_color":"%230a0a1a","theme_color":"%230a0a1a","orientation":"any","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiB2aWV3Qm94PSIwIDAgMTkyIDE5MiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCUiIHkxPSIwJSIgeDI9IjEwMCUiIHkyPSIxMDAlIj48c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjOGI1Y2Y2Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjE5MiIgaGVpZ2h0PSIxOTIiIHJ4PSI0MCIgZmlsbD0idXJsKCNnKSIvPjx0ZXh0IHg9Ijk2IiB5PSIxMjAiIGZvbnQtc2l6ZT0iOTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIiBmb250LWZhbWlseT0iQXJpYWwiPvCfk6U8L3RleHQ+PC9zdmc+","sizes":"192x192","type":"image/svg+xml"}]}'>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📡</text></svg>'>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Fullscreen Iframe - No restrictions */
        .iframe-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        #routerFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        /* Loading Screen */
        .loader-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        /* Fallback UI */
        .fallback-ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 26, 0.98);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 30px;
            text-align: center;
        }

        .fallback-ui.show { display: flex; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .fallback-icon { font-size: 64px; margin-bottom: 20px; }
        
        .fallback-title {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .fallback-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 320px;
        }

        .fallback-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .fallback-btn:active { transform: scale(0.96); }

        /* Install Banner */
        .install-banner {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 10000;
            animation: slideUp 0.4s ease;
        }

        .install-banner.show { display: flex; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .install-info { display: flex; align-items: center; gap: 12px; }
        .install-info span { font-size: 28px; }
        
        .install-text { font-size: 12px; color: #94a3b8; }
        .install-text strong { color: #fff; display: block; font-size: 14px; margin-bottom: 2px; }

        .install-btn {
            padding: 10px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .close-banner {
            position: absolute;
            top: 8px; right: 12px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 20px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            color: #10b981;
            font-size: 13px;
            font-weight: 600;
            z-index: 99999;
            transition: transform 0.4s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader-screen" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Router Admin লোড হচ্ছে...</div>
    </div>

    <!-- Main Iframe View - NO SANDBOX for full functionality -->
    <div class="iframe-wrapper">
        <iframe 
            id="routerFrame" 
            src="http://192.168.0.1/login.html"
            allow="fullscreen; camera; microphone; geolocation; autoplay; clipboard-read; clipboard-write"
            referrerpolicy="no-referrer"
            title="Router Admin"
        ></iframe>
    </div>

    <!-- Fallback UI (Shows only if iframe is blocked) -->
    <div class="fallback-ui" id="fallbackUI">
        <div class="fallback-icon">🔒</div>
        <div class="fallback-title">Browser Security Block</div>
        <div class="fallback-desc">
            ব্রাউজারের Mixed Content (HTTPS → HTTP) সিকিউরিটির কারণে আইফ্রেম লোড হয়নি। 
            সরাসরি রাউটার পেজে যেতে নিচের বাটনে চাপুন।
        </div>
        <a href="http://192.168.0.1/login.html" class="fallback-btn" target="_blank">
            Open Router Directly
        </a>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Message</div>

    <!-- Install Banner -->
    <div class="install-banner" id="installBanner">
        <button class="close-banner" onclick="closeBanner()"></button>
        <div class="install-info">
            <span>📱</span>
            <div class="install-text">
                <strong>Install as App</strong>
                App হিসেবে ব্যবহার করুন
            </div>
        </div>
        <button class="install-btn" onclick="installApp()">INSTALL</button>
    </div>

    <script>
        // ==========================================
        // 1. INLINE SERVICE WORKER (PWA Support)
        // ==========================================
        const swCode = `
            const CACHE = 'router-pwa-v3';
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                    fetch(e.request).then(res => {
                        if (res.status === 200) {
                            const clone = res.clone();
                            caches.open(CACHE).then(cache => cache.put(e.request, clone));
                        }
                        return res;
                    }).catch(() => caches.match(e.request))
                );
            });
        `;

        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url).catch(() => {});
        }

        // ==========================================
        // 2. IFRAME LOAD DETECTION
        // ==========================================
        const routerFrame = document.getElementById('routerFrame');
        const loader = document.getElementById('loader');
        const fallbackUI = document.getElementById('fallbackUI');
        let loadTimeout;

        // Iframe successfully loaded
        routerFrame.addEventListener('load', () => {
            clearTimeout(loadTimeout);
            loader.classList.add('hidden');
        });

        // Timeout fallback: 5 seconds
        loadTimeout = setTimeout(() => {
            loader.classList.add('hidden');
            fallbackUI.classList.add('show');
        }, 5000);

        // ==========================================
        // 3. TOAST NOTIFICATION
        // ==========================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==========================================
        // 4. PWA INSTALL LOGIC
        // ==========================================
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                if (deferredPrompt) {
                    document.getElementById('installBanner').classList.add('show');
                }
            }, 2500);
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') {
                        showToast('App ইনস্টল হচ্ছে! 🎉');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.remove('show');
                });
            } else {
                showToast('ব্রাউজার মেনু (⋮) → "Install App" চাপুন');
            }
        }

        function closeBanner() {
            document.getElementById('installBanner').classList.remove('show');
        }

        window.addEventListener('appinstalled', () => {
            showToast('App সফলভাবে ইনস্টল হয়েছে! 🎉');
            document.getElementById('installBanner').classList.remove('show');
        });
    </script>
</body>
</html>
